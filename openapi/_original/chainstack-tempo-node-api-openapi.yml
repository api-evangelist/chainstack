            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: web3_sha3
                params:
                  type: array
                  items: {}
                  default:
                  - '0x68656c6c6f'
                  description: Data to hash (hex encoded)
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Keccak-256 hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
