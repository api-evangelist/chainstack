      summary: Eth_Syncing
      operationId: tempo-eth-syncing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_syncing
                params:
                  type: array
                  items: {}
                  default: []
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    oneOf:
                    - type: boolean
                      description: false if the node is not syncing
                    - type: object
                      description: Sync status object if syncing
                      properties:
                        startingBlock:
                          type: string
                        currentBlock:
                          type: string
                        highestBlock:
                          type: string
