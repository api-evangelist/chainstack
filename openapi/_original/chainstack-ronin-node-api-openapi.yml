      tags:
      - General
      summary: Get transaction by block number and index
      operationId: getTransactionByBlockNumberAndIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionByBlockNumberAndIndex
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - latest
                  - '0x0'
      responses:
        '200':
          description: Information about the requested transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionByHash:
    post:
      tags:
      - General
      summary: Get transaction information by hash
      operationId: getTransactionByHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionByHash
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0x1e196c5fa958d3752b92a3178dd71e8050a0b4a72f528a72c3c12b09b5fc523a'
      responses:
        '200':
          description: Information about the requested transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionCount:
    post:
      tags:
      - General
      summary: Get transaction count for an address
      operationId: getTransactionCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionCount
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0xa459322a949b97c1cbcf3c82dfc4de9fefc6fb7c'
                  - latest
      responses:
        '200':
          description: Number of transactions sent from the address
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_getTransactionReceipt:
    post:
      tags:
      - General
      summary: Get transaction receipt by hash
      operationId: getTransactionReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionReceipt
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0x1e196c5fa958d3752b92a3178dd71e8050a0b4a72f528a72c3c12b09b5fc523a'
      responses:
        '200':
          description: Receipt of the requested transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
