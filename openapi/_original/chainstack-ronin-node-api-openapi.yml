                    type: object
  /eth_maxPriorityFeePerGas:
    post:
      tags:
      - General
      summary: Get current max priority fee per gas
      operationId: getMaxPriorityFeePerGas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_maxPriorityFeePerGas
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: Current max priority fee per gas in wei
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_newBlockFilter:
    post:
      tags:
      - General
      summary: Create a new block filter
      operationId: newBlockFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_newBlockFilter
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: The filter ID for the new block filter
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_newFilter:
    post:
      tags:
      - General
      summary: eth_newFilter
      operationId: newFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_newFilter
                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  items:
                    type: object
                    properties:
                      fromBlock:
                        type: string
                        default: latest
                      address:
                        type: string
                        default: '0x0b7007c13325c48911f73a2dad5fa5dcbf808adc'
                      topics:
                        type: array
                        items:
                          type: string
                        default:
