                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionByBlockHashAndIndex
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0x66d67565dc84eb6e579ebe142683e4338498653ff6b7a6e2724e80a73aca4f20'
                  - '0x0'
      responses:
        '200':
          description: Information about the requested transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionByBlockNumberAndIndex:
