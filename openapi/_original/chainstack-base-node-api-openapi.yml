              - params
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBalance
                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  default:
                  - '0xF977814e90dA44bFA03b6295A0616a897441aceC'
                  - latest
                  items:
                    type: string
      responses:
        '200':
          description: The balance of the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_getBlockByHash:
    post:
      tags:
      - General
      summary: eth_getBlockByHash
      operationId: getBlockByHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockByHash
                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      default: '0x07fcc7d5f86839e12afa756e979de05812b5341f936b850c9409aa0938819b30'
                    - type: boolean
                      default: true
                  default:
                  - '0x07fcc7d5f86839e12afa756e979de05812b5341f936b850c9409aa0938819b30'
                  - true
      responses:
        '200':
          description: The block information by hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getBlockByNumber:
    post:
      tags:
      - General
      summary: eth_getBlockByNumber
      operationId: getBlockByNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockByNumber
                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      default: '0xbb623d'
                    - type: boolean
                      default: true
                  default:
                  - '0xbb623d'
                  - true
      responses:
        '200':
          description: The block information by number
          content:
