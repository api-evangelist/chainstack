                          default: '0xaeA8F8f781326bfE6A7683C2BD48Dd6AA4d3Ba63'
                        data:
                          type: string
                          default: '0x608060806080608155'
                    - type: string
                      default: pending
                  default:
                  - from: '0xaeA8F8f781326bfE6A7683C2BD48Dd6AA4d3Ba63'
                    data: '0x608060806080608155'
                  - pending
      responses:
        '200':
          description: The generated access list and gas used
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    properties:
                      accessList:
                        type: array
                        items:
                          type: object
                          properties:
                            address:
                              type: string
                            storageKeys:
                              type: array
                              items:
                                type: string
                      gasUsed:
                        type: string
  /eth_estimateGas:
    post:
      tags:
      - General
      summary: eth_estimateGas
      operationId: estimateGas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
