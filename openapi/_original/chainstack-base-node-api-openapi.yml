                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        from:
                          type: string
                          default: '0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045'
                        to:
                          type: string
                          default: '0xbe0eb53f46cd790cd13851d5eff43d12404d33e8'
                    - type: string
                      default: latest
                  default:
                  - from: '0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045'
                    to: '0xbe0eb53f46cd790cd13851d5eff43d12404d33e8'
                  - latest
      responses:
        '200':
          description: The estimated gas required
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_feeHistory:
    post:
      tags:
      - General
      summary: eth_feeHistory
      operationId: feeHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_feeHistory
                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  items:
                    anyOf:
                    - type: integer
                    - type: string
                    - type: array
                      items:
                        type: integer
                    - type: array
                      items:
                        type: string
                  default:
                  - 1024
                  - latest
                  - - 10
                    - 20
                    - 30
      responses:
        '200':
          description: Historical gas fee data
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    properties:
                      oldestBlock:
                        type: string
                      baseFeePerGas:
                        type: array
                        items:
                          type: string
                      gasUsedRatio:
                        type: array
                        items:
                          type: number
                      reward:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
  /eth_gasPrice:
    post:
      tags:
      - General
      summary: eth_gasPrice
      operationId: gasPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
