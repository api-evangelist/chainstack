                            example: 41e38c95e0d7e9b68f7c8f7b4d3e6a5c2b1f9e8d7c6b5a4f3e2d1c0b9a8
                      witness_signature:
                        type: string
                        description: Witness signature for the current block
                  transactions:
                    type: array
                    description: Transactions in the current block
                    items:
                      type: object
                      properties:
                        txID:
                          type: string
                        raw_data:
                          type: object
                        signature:
                          type: array
                          items:
                            type: string
                  blockSize:
                    type: integer
                    description: Size of the current block in bytes
                    example: 1024
