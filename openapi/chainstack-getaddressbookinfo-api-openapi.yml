openapi: 3.2.0
info:
  title: Chainstack TON Node Get Address Book Info API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetAddressBookInfo
paths:
  /getAddressBookInfo:
    get:
      summary: Get Address Book Information
      description: Retrieves information about an address from the address book
      operationId: getAddressBookInfo
      tags:
      - GetAddressBookInfo
      parameters:
      - name: address
        in: query
        description: The address to look up in the address book
        required: true
        schema:
          type: string
          default: 0:ed1691307050047117b998b561d8de82d31fbf84910ced6eb5fc92e7485ef8a7
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name associated with the address
                  description:
                    type: string
                    description: A description of the address or associated entity
                  icon:
                    type: string
                    description: URL of an icon associated with the address
                  website:
                    type: string
                    description: Website associated with the address
                  address:
                    type: string
                    description: The queried address
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
