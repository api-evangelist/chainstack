openapi: 3.2.0
info:
  title: Chainstack Accounts Info API
  version: 1.0.0
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
  description: 'Operations tagged Accounts Info across 6 of this provider''s published API definitions: chainstack-arbitrum-node-api-openapi.yml, chainstack-avalanche-node-api-openapi.yml, chainstack-ethereum-node-api-openapi.yml, chainstack-gnosis-node-api-openapi.yml, chainstack-monad-node-api-openapi.yml, chainstack-plasma-node-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Accounts Info
paths:
  /eth_getBalance:
    post:
      tags:
      - Accounts Info
      summary: eth_getBalance
      operationId: getBalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBalance
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Address
                      description: The address identifier.
                    - type: string
                      title: Block identifier
                      description: The block identifier.
                  default:
                  - '0x13867a801e352e219c2d2AC29288Bf086e5C81ef'
                  - pending
      responses:
        '200':
          description: The account balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_getCode:
    post:
      tags:
      - Accounts Info
      summary: eth_getCode
      operationId: getCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getCode
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Smart contract address
                      description: The address identifier.
                    - type: string
                      title: Block identifier
                      description: The block identifier.
                  default:
                  - '0xFa7F8980b0f1E64A2062791cc3b0871572f1F7f0'
                  - latest
      responses:
        '200':
          description: The smart contract code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_getStorageAt:
    post:
      tags:
      - Accounts Info
      summary: eth_getStorageAt
      operationId: getStorageAt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  default: eth_getStorageAt
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Smart contract address
                      description: The address of the contract to query.
                    - type: string
                      title: Slot index
                      description: The index of the storage position to query.
                    - type: string
                      title: Block ID
                      description: The block number or tag to use as a reference.
                  default:
                  - '0x92c5dfaA4f5083914b1191a4618Ec35506C1CE16'
                  - '0x0'
                  - latest
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
      responses:
        '200':
          description: The value stored at the specified position.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_getTransactionCount:
    post:
