openapi: 3.2.0
info:
  title: Chainstack TON Node Get Metadata API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetMetadata
paths:
  /getMetadata:
    get:
      summary: Get Metadata
      description: Query address metadata including names and labels
      operationId: getMetadata
      tags:
      - GetMetadata
      parameters:
      - name: address
        in: query
        description: Address to get metadata for
        required: true
        schema:
          type: string
          default: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    description: The queried address
                  name:
                    type: string
                    description: Human-readable name for the address
                  is_scam:
                    type: boolean
                    description: Whether the address is flagged as scam
                  icon:
                    type: string
                    description: URL to the address icon
                  is_wallet:
                    type: boolean
                    description: Whether the address is a wallet contract
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
