openapi: 3.2.0
info:
  title: Chainstack TON Node Get Jetton Masters API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetJettonMasters
paths:
  /getJettonMasters:
    get:
      summary: Get Jetton Masters
      description: Retrieves a list of Jetton master contracts from the TON blockchain
      operationId: getJettonMasters
      tags:
      - GetJettonMasters
      parameters:
      - name: limit
        in: query
        description: The maximum number of Jetton masters to return
        required: false
        schema:
          type: integer
          default: 128
      - name: offset
        in: query
        description: The number of Jetton masters to skip before starting to return results
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  masters:
                    type: array
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                          description: The address of the Jetton master contract
                        name:
                          type: string
                          description: The name of the Jetton
                        symbol:
                          type: string
                          description: The symbol of the Jetton
                        decimals:
                          type: integer
                          description: The number of decimal places for the Jetton
                        totalSupply:
                          type: string
                          description: The total supply of the Jetton
                        mintable:
                          type: boolean
                          description: Whether new tokens can be minted
                        admin:
                          type: string
                          description: The address of the Jetton admin
                        metadata:
                          type: object
                          description: Additional metadata of the Jetton
                        contentUri:
                          type: string
                          description: The URI of the Jetton's content
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
