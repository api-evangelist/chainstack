openapi: 3.2.0
info:
  title: Chainstack TON Node Get Actions API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetActions
paths:
  /getActions:
    get:
      summary: Get Actions
      description: Retrieves decoded actions from transactions
      operationId: getActions
      tags:
      - GetActions
      parameters:
      - name: action_id
        in: query
        description: Action ID to filter by
        schema:
          type: string
      - name: trace_id
        in: query
        description: Trace ID to get actions for
        schema:
          type: string
      - name: tx_hash
        in: query
        description: Transaction hash to get actions for
        schema:
          type: string
          default: BhLJTdV2R6Vr5c3BAOjH8nFpnMYOuPcJvRlagGSKU88=
      - name: tx_lt
        in: query
        description: Transaction logical time
        schema:
          type: integer
      - name: account
        in: query
        description: Filter by account address
        schema:
          type: string
      - name: action_type
        in: query
        description: Filter by action type (e.g., JettonTransfer, NftItemTransfer)
        schema:
          type: string
      - name: start_utime
        in: query
        description: Start of the time range (unix timestamp)
        schema:
          type: integer
      - name: end_utime
        in: query
        description: End of the time range (unix timestamp)
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of actions to return
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of actions to skip
        schema:
          type: integer
          default: 0
      - name: sort
        in: query
        description: Sort order
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action_id:
                          type: string
                          description: Unique identifier for the action
                        trace_id:
                          type: string
                          description: Trace ID this action belongs to
                        tx_hash:
                          type: string
                          description: Transaction hash
                        type:
                          type: string
                          description: Type of action (e.g., JettonTransfer, TonTransfer)
                        status:
                          type: string
                          description: Action status
                        value:
                          type: object
                          description: Action-specific value data
                        start_lt:
                          type: integer
                          description: Logical time at action start
                        start_utime:
                          type: integer
                          description: Unix timestamp at action start
                        end_lt:
                          type: integer
                          description: Logical time at action end
                        end_utime:
                          type: integer
                          description: Unix timestamp at action end
                  address_book:
                    type: object
                    description: Address book mapping addresses to user-friendly names
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
