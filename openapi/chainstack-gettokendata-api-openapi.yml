openapi: 3.2.0
info:
  title: Chainstack TON Node Get Token Data API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetTokenData
paths:
  /getTokenData:
    get:
      tags:
      - GetTokenData
      summary: getTokenData
      operationId: getTokenData
      parameters:
      - name: address
        in: query
        required: true
        description: The address of the token contract
        schema:
          type: string
          default: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs
        example: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs
      responses:
        '200':
          description: Data about the specified token
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the token
                  symbol:
                    type: string
                    description: The symbol of the token
                  decimals:
                    type: integer
                    description: The number of decimal places for the token
                  totalSupply:
                    type: string
                    description: The total supply of the token
                  mintable:
                    type: boolean
                    description: Whether the token is mintable
                  burnable:
                    type: boolean
                    description: Whether the token is burnable
                  address:
                    type: string
                    description: The address of the token contract
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
