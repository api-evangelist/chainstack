openapi: 3.2.0
info:
  title: Chainstack TON Node Get Wallet Info API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetWalletInfo
paths:
  /getWalletInfo:
    get:
      summary: Get Wallet Information
      description: Retrieves information about a specific wallet on the TON blockchain
      operationId: getWalletInfo
      tags:
      - GetWalletInfo
      parameters:
      - name: address
        in: query
        description: The address of the wallet to retrieve information for
        required: true
        schema:
          type: string
          default: 0QAvTjjA5ZBbHN3a-SYnO1qvzlgNx09OC2bhYBPAbfs3S6q7
        example: 0QAvTjjA5ZBbHN3a-SYnO1qvzlgNx09OC2bhYBPAbfs3S6q7
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: boolean
                    description: Indicates if the address is a wallet
                  balance:
                    type: string
                    description: The balance of the wallet in nanotons
                  account_state:
                    type: string
                    description: The state of the account (e.g., active, uninitialized)
                  wallet_type:
                    type: string
                    description: The type of the wallet contract
                  seqno:
                    type: integer
                    description: The current sequence number of the wallet
                  last_transaction_lt:
                    type: string
                    description: The logical time of the last transaction
                  last_transaction_hash:
                    type: string
                    description: The hash of the last transaction
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
