        '200':
          description: Information about the validation of the address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      isvalid:
                        type: boolean
                        description: Whether the address is a valid Bitcoin address.
                      address:
                        type: string
                        description: The Bitcoin address validated (if valid).
                      scriptPubKey:
                        type: string
                        description: The hex-encoded scriptPubKey generated by the address.
                      ismine:
                        type: boolean
                        description: Whether the address belongs to the wallet (if wallet support is enabled).
                      iswatchonly:
                        type: boolean
                        description: Whether the address is watch-only (if wallet support is enabled).
                      isscript:
                        type: boolean
                        description: Whether the address is a script.
                      script:
                        type: string
                        description: The type of script, if `isscript` is true.
                      hex:
                        type: string
                        description: The hex-encoded redeemScript (for P2SH) or witnessScript (for P2WSH), if applicable.
                      addresses:
                        type: array
                        items:
                          type: string
                        description: Array of addresses associated with the script (for multisig scripts).
                      sigsrequired:
                        type: integer
                        description: Number of signatures required (for multisig scripts).
                      pubkey:
                        type: string
                        description: The hex-encoded public key (for P2PKH and P2WPKH addresses).
                      iscompressed:
                        type: boolean
                        description: Whether the public key is compressed.
                      account:
                        type: string
                        description: DEPRECATED. The account associated with the address (will be removed in future  versions).
                      timestamp:
                        type: integer
                        description: Timestamp of the address if known.
                      hdkeypath:
                        type: string
                        description: The HD keypath, if the address is HD wallet related.
                      hdseedid:
                        type: string
                        description: The Hash160 of the HD seed.
                      hdmasterfingerprint:
                        type: string
                        description: The fingerprint of the master key.
                      labels:
                        type: array
                        items:
                          type: string
                        description: User-assigned labels for the address.
                  error:
                    type: object
                  id:
                    type: integer
