    post:
      tags:
      - General
      summary: Validateaddress
      operationId: validateAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '1.0'
                method:
                  type: string
                  default: validateaddress
                params:
                  type: array
                  items:
                    type: string
