      - Filter Handling
  /eth_estimateGas:
    post:
      tags:
      - Gas Data
      summary: eth_estimateGas
      operationId: estimateGas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_estimateGas
                params:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                        format: byte
                      to:
                        type: string
                        format: byte
                  default:
                  - from: '0x60dBc646a860F9eC715976f6A69D5Bc71BDaad98'
                    to: '0xbe0eb53f46cd790cd13851d5eff43d12404d33e8'
                  - latest
      responses:
        '200':
          description: The estimated gas amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
                    format: byte
  /eth_gasPrice:
    post:
      tags:
      - Gas Data
      summary: eth_gasPrice
      operationId: getGasPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
