                      title: Transaction hash
                      description: The hash of the transaction to trace.
                    - type: object
                      title: Tracing options
                  default:
                  - '0x9f96be4a4a10e1ac3a07b1a0fbd232fcc7049dd6d6593e335c94a4bdbb2ede40'
                  - tracer: prestateTracer
      responses:
        '200':
          description: The transaction's trace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_call:
    post:
      tags:
      - Execute Transactions
      summary: Eth_Call
      operationId: ethCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_call
                id:
                  type: integer
                  default: 1
                params:
                  type: array
                  items:
                    type: object
                    title: Call object
                    properties:
                      to:
                        type: string
                        description: The address of the contract to call.
                      data:
                        type: string
                        description: The data to send with the call.
                  default:
                  - to: '0xd6a4F121CA35509aF06A0Be99093d08462f53052'
                    data: '0x081e3eda'
                  - latest
      responses:
        '200':
          description: The result of the call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_sendRawTransaction:
    post:
      tags:
      - Execute Transactions
      summary: eth_sendRawTransaction
      operationId: sendRawTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_sendRawTransaction
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      description: The signed transaction.
                  default:
                  - '0xd46e8dd67c5d32be8d46e8dd67c5d32be8058bb8eb970870f072445675058bb8eb970870f072445675'
      responses:
        '200':
          description: The transaction hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getFilterChanges:
