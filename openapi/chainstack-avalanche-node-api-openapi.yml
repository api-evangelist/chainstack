                    type: string
                    title: Block hash
                    description: The block hash identifier.
                  default:
                  - '0x3e76cf8acbbc6d07a2ae51a7af0457589264e67aaf0e94e2d2e0c09e5b6c04db'
      responses:
        '200':
          description: The block information
          content:
            application/json:
              schema:
                type: object
