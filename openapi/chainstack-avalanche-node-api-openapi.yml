                    type: integer
                  result:
                    type: object
  /net_listening:
    post:
      tags:
      - Client Info
      summary: Net_Listening
      operationId: listening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: net_listening
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: The boolean value that indicates whether or not a node is currently actively seeking peer connections.
