openapi: 3.0.3
info:
  title: Chainstack Arbitrum Node Account Info Filter Handling API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the Arbitrum blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/<key>). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/arbitrum_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Filter Handling
paths:
  /eth_getFilterChanges:
    post:
      summary: eth_getFilterChanges
      operationId: getFilterChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getFilterChanges
                params:
                  type: array
                  items:
                    type: string
                    title: The filter ID
                  default:
                  - '0x2d66dbc76b6ddff76ddcfbd081d03130'
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: The filter changes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: array
                    items:
                      type: string
      tags:
      - Filter Handling
  /eth_uninstallFilter:
    post:
      summary: eth_uninstallFilter
      operationId: uninstallFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_uninstallFilter
                params:
                  type: array
                  items:
                    type: string
                    title: Filter ID
                  default:
                  - '0xbdc5b4b99ca699e1d734fc4202afee79'
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Boolean value indicating if the filter was removed or not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: boolean
      tags:
      - Filter Handling
  /eth_newBlockFilter:
    post:
      tags:
      - Filter Handling
      summary: eth_newBlockFilter
      operationId: newBlockFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_newBlockFilter
                params:
                  type: array
                  items: {}
                  default: []
      responses:
        '200':
          description: Creates a filter in the node to notify when a new block arrives.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    nullable: true
  /eth_newFilter:
    post:
      tags:
      - Filter Handling
      summary: eth_newFilter
      operationId: newFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_newFilter
                params:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      title: Filter options
                      description: The filter options object.
                  default:
                  - fromBlock: latest
                    toBlock: latest
      responses:
        '200':
          description: Creates a filter object based on filter options to notify when the state changes (logs).
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    nullable: true
  /eth_newPendingTransactionFilter:
    post:
      tags:
      - Filter Handling
      summary: eth_newPendingTransactionFilter
      operationId: newPendingTransactionFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_newPendingTransactionFilter
                params:
                  type: array
                  items: {}
                  default: []
      responses:
        '200':
          description: Creates a filter in the node to notify when new pending transactions arrive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    nullable: true
