openapi: 3.2.0
info:
  title: Chainstack TON Node Get Messages API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetMessages
paths:
  /getMessages:
    get:
      summary: Get Messages
      description: Retrieves a list of messages from the TON blockchain
      operationId: getMessages
      tags:
      - GetMessages
      parameters:
      - name: limit
        in: query
        description: The maximum number of messages to return
        required: false
        schema:
          type: integer
          default: 128
      - name: offset
        in: query
        description: The number of messages to skip before starting to return results
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        hash:
                          type: string
                          description: The message hash
                        source:
                          type: string
                          description: The source address of the message
                        destination:
                          type: string
                          description: The destination address of the message
                        value:
                          type: string
                          description: The value transferred in the message
                        fwd_fee:
                          type: string
                          description: The forward fee for the message
                        ihr_fee:
                          type: string
                          description: The IHR (Instant Hypercube Routing) fee for the message
                        created_lt:
                          type: string
                          description: The logical creation time of the message
                        body_hash:
                          type: string
                          description: The hash of the message body
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
