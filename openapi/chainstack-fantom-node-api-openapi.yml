                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionByBlockNumberAndIndex
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Block number
                    - type: string
                      title: Transaction index
                  default:
                  - '0x4b805fe'
                  - '0x1'
      responses:
        '200':
          description: The transaction information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionByHash:
    post:
      tags:
      - General
      summary: eth_getTransactionByHash
      operationId: getTransactionByHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionByHash
                params:
                  type: array
                  items:
                    type: string
                    title: Transaction hash
                  default:
                  - '0x58e61f99a15aa3cd76162037225287a574d9eda91d2a9d35ff0fcde1cccda4a0'
      responses:
        '200':
          description: The transaction information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionCount:
    post:
      tags:
      - General
      summary: eth_getTransactionCount
      operationId: getTransactionCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionCount
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Address
                      description: The address to check
                    - type: string
                      title: Block identifier
                      description: The block identifier
                  default:
                  - '0x18443ddbc5cd7Fb2F07551b54A37254F06819464'
                  - latest
      responses:
        '200':
          description: The address nonce
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionReceipt:
    post:
      tags:
