openapi: 3.2.0
info:
  title: Chainstack TON Node Get Address Information API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetAddressInformation
paths:
  /getAddressInformation:
    get:
      tags:
      - GetAddressInformation
      summary: getAddressInformation
      operationId: getAddressInformation
      parameters:
      - name: address
        in: query
        required: true
        description: The address to get information for
        schema:
          type: string
          default: EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2
        example: EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2
      responses:
        '200':
          description: Information about the specified address
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: string
                    description: The balance of the address
                  state:
                    type: string
                    description: The state of the address
                  code:
                    type: string
                    description: The code of the address
                  data:
                    type: string
                    description: The data of the address
                  last_transaction_id:
                    type: object
                    properties:
                      lt:
                        type: string
                        description: The logical time of the last transaction
                      hash:
                        type: string
                        description: The hash of the last transaction
                  error:
                    type: object
                  id:
                    type: integer
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
