openapi: 3.2.0
info:
  title: Chainstack TON Node Get Blocks API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetBlocks
paths:
  /getBlocks:
    get:
      summary: Get Blocks
      description: Retrieves a list of blocks from the TON blockchain
      operationId: getBlocks
      tags:
      - GetBlocks
      parameters:
      - name: limit
        in: query
        description: The maximum number of blocks to return
        required: false
        schema:
          type: integer
          default: 128
      - name: offset
        in: query
        description: The number of blocks to skip before starting to return results
        required: false
        schema:
          type: integer
          default: 0
      - name: sort
        in: query
        description: The sorting order of the blocks
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        seqno:
                          type: integer
                          description: The sequence number of the block
                        shard:
                          type: string
                          description: The shard identifier of the block
                        workchain:
                          type: integer
                          description: The workchain ID of the block
                        fileHash:
                          type: string
                          description: The file hash of the block
                        rootHash:
                          type: string
                          description: The root hash of the block
                        timestamp:
                          type: integer
                          description: The timestamp of the block
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
