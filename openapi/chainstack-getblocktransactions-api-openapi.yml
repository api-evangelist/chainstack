openapi: 3.2.0
info:
  title: Chainstack TON Node Get Block Transactions API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetBlockTransactions
paths:
  /getBlockTransactions:
    get:
      tags:
      - GetBlockTransactions
      summary: getBlockTransactions
      operationId: getBlockTransactions
      parameters:
      - name: workchain
        in: query
        required: true
        description: The workchain ID
        schema:
          type: integer
          default: -1
        example: -1
      - name: shard
        in: query
        required: true
        description: The shard ID
        schema:
          type: string
          default: '-9223372036854775808'
        example: '-9223372036854775808'
      - name: seqno
        in: query
        required: true
        description: The sequence number of the block
        schema:
          type: integer
          default: 39064874
        example: 39064874
      - name: count
        in: query
        required: false
        description: The maximum number of transactions to return
        schema:
          type: integer
          default: 40
        example: 40
      responses:
        '200':
          description: Transactions from the specified block
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: object
                    properties:
                      workchain:
                        type: integer
                        description: The workchain ID of the block
                      shard:
                        type: string
                        description: The shard ID of the block
                      seqno:
                        type: integer
                        description: The sequence number of the block
                      root_hash:
                        type: string
                        description: The root hash of the block
                      file_hash:
                        type: string
                        description: The file hash of the block
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        account:
                          type: string
                          description: The account address involved in the transaction
                        hash:
                          type: string
                          description: The transaction hash
                        lt:
                          type: string
                          description: The logical time of the transaction
                  incomplete:
                    type: boolean
                    description: Indicates if the returned list is incomplete
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
