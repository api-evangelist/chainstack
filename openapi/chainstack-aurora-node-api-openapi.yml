                  type: string
                  default: eth_getStorageAt
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Smart contract address
                      description: The address of the contract to query.
                    - type: string
                      title: Slot index
                      description: The index of the storage position to query.
                    - type: string
                      title: Block ID
                      description: The block number or tag to use as a reference.
                  default:
                  - '0xC9BdeEd33CD01541e1eeD10f90519d2C06Fe3feB'
                  - '0x2'
                  - latest
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
      responses:
        '200':
          description: The value stored at the specified position.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
