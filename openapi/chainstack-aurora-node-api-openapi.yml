      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockTransactionCountByHash
                params:
                  type: array
                  items:
                    type: string
                    title: Block hash
                    description: The block hash identifier.
                  default:
                  - '0x5db8ff1beb252c1a9cb390ef25af04e2763bdee1bcd48c76977a17148bba503d'
      responses:
        '200':
          description: The block information
          content:
            application/json:
              schema:
