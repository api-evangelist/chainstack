openapi: 3.2.0
info:
  title: Chainstack Gas Data API
  version: 1.0.0
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
  description: 'Operations tagged Gas Data across 8 of this provider''s published API definitions: chainstack-arbitrum-node-api-openapi.yml, chainstack-avalanche-node-api-openapi.yml, chainstack-ethereum-node-api-openapi.yml, chainstack-gnosis-node-api-openapi.yml, chainstack-monad-node-api-openapi.yml, chainstack-plasma-node-api-openapi.yml, chainstack-polygon-node-api-openapi.yml, chainstack-tempo-node-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Gas Data
paths:
  /eth_estimateGas:
    post:
      tags:
      - Gas Data
      summary: eth_estimateGas
      operationId: estimateGas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_estimateGas
                params:
                  type: array
                  items:
                    type: object
                    properties:
                      from:
                        type: string
                        format: byte
                      to:
                        type: string
                        format: byte
                  default:
                  - from: '0x13867a801e352e219c2d2AC29288Bf086e5C81ef'
                    to: '0xbe0eb53f46cd790cd13851d5eff43d12404d33e8'
                  - latest
      responses:
        '200':
          description: The estimated gas amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
                    format: byte
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_gasPrice:
    post:
      tags:
      - Gas Data
      summary: eth_gasPrice
      operationId: getGasPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_gasPrice
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: The value of the current gas base fee in Wei.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_maxPriorityFeePerGas:
    post:
      tags:
      - Gas Data
      summary: eth_maxPriorityFeePerGas
      operationId: maxPriorityFeePerGas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_maxPriorityFeePerGas
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: The estimated max priority fee per gas
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
                    format: byte
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_feeHistory:
    post:
      tags:
      - Gas Data
      summary: eth_feeHistory
      operationId: eth_feeHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_feeHistory
                params:
                  type: array
                  default:
                  - '0x4'
                  - latest
                  - - 25
                    - 75
      responses:
        '200':
          description: Fee history for the requested block range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
  /eth_blobBaseFee:
    post:
      tags:
      - Gas Data
      summary: eth_blobBaseFee
      operationId: blobBaseFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_blobBaseFee
                params:
                  type: array
                  items: {}
                  default: []
      responses:
        '200':
          description: Returns the base fee for blob gas in wei.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type:
                    - object
                    - 'null'
    servers:
    - url: https://{node_id}.p2pify.com/{api_key}
      description: Chainstack-managed node endpoint
      variables:
        node_id:
          default: nd-000-000-000
          description: Your Chainstack node identifier
        api_key:
          default: <api-key>
          description: Per-node access key
x-refined-from:
- chainstack-arbitrum-node-api-openapi.yml
- chainstack-avalanche-node-api-openapi.yml
- chainstack-ethereum-node-api-openapi.yml
