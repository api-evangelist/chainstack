openapi: 3.2.0
info:
  title: Chainstack TON Node Run Get Method API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: RunGetMethod
paths:
  /runGetMethod:
    post:
      tags:
      - RunGetMethod
      summary: runGetMethod
      operationId: runGetMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: The address of the smart contract
                  default: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs
                method:
                  type: string
                  description: The name of the get method to execute
                  default: get_wallet_address
                stack:
                  type: array
                  description: The stack of parameters for the method
                  items:
                    type: array
                    items:
                      type: string
                  default:
                  - - tvm.Slice
                    - te6cckEBAQEAJAAAQ4AbUzrTQYTUv8s/I9ds2TSZgRjyrgl2S2LKcZMEFcxj6PARy3rF
      responses:
        '200':
          description: The result of executing the get method
          content:
            application/json:
              schema:
                type: object
                properties:
                  exit_code:
                    type: integer
                    description: The exit code of the method execution
                  stack:
                    type: array
                    description: The resulting stack after method execution
                    items:
                      type: array
                      items:
                        type: string
                  gas_used:
                    type: integer
                    description: The amount of gas used for the execution
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
