openapi: 3.2.0
info:
  title: Chainstack TON Node Get Masterchain Info API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetMasterchainInfo
paths:
  /getMasterchainInfo:
    get:
      tags:
      - GetMasterchainInfo
      summary: getMasterchainInfo
      operationId: getMasterchainInfo
      responses:
        '200':
          description: Information about the current state of the TON masterchain
          content:
            application/json:
              schema:
                type: object
                properties:
                  last:
                    type: object
                    properties:
                      seqno:
                        type: integer
                        description: The sequence number of the last masterchain block
                      shard:
                        type: string
                        description: The shard identifier of the last masterchain block
                      workchain:
                        type: integer
                        description: The workchain identifier of the last masterchain block
                      fileHash:
                        type: string
                        description: The file hash of the last masterchain block
                      rootHash:
                        type: string
                        description: The root hash of the last masterchain block
                  init:
                    type: object
                    properties:
                      fileHash:
                        type: string
                        description: The file hash of the initial masterchain block
                      rootHash:
                        type: string
                        description: The root hash of the initial masterchain block
                  stateRootHash:
                    type: string
                    description: The state root hash of the masterchain
                  version:
                    type: integer
                    description: The version of the masterchain
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
