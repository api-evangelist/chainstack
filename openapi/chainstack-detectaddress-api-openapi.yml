openapi: 3.2.0
info:
  title: Chainstack TON Node Detect Address API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: DetectAddress
paths:
  /detectAddress:
    get:
      tags:
      - DetectAddress
      summary: detectAddress
      operationId: detectAddress
      parameters:
      - name: address
        in: query
        required: true
        description: The address to detect
        schema:
          type: string
          default: EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2
        example: EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2
      responses:
        '200':
          description: Information about the detected address
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw_form:
                    type: string
                    description: The raw form of the address
                  bounceable:
                    type: object
                    properties:
                      b64:
                        type: string
                        description: The bounceable address in base64 format
                      b64url:
                        type: string
                        description: The bounceable address in base64url format
                  non_bounceable:
                    type: object
                    properties:
                      b64:
                        type: string
                        description: The non-bounceable address in base64 format
                      b64url:
                        type: string
                        description: The non-bounceable address in base64url format
                  given_type:
                    type: string
                    description: The type of the given address
                  test_only:
                    type: boolean
                    description: Whether the address is for testnet only
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
