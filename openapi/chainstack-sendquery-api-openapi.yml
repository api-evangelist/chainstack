openapi: 3.2.0
info:
  title: Chainstack TON Node Send Query API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: SendQuery
paths:
  /sendQuery:
    post:
      tags:
      - SendQuery
      summary: sendQuery
      operationId: sendQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: The destination address for the message
                  default: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs
                body:
                  type: string
                  description: The body of the message in base64 format
                  default: te6cckEBAQEAAgAAAEysuc0=
                init_code:
                  type: string
                  description: Optional init code in base64 format for contract deployment
                init_data:
                  type: string
                  description: Optional init data in base64 format for contract deployment
              required:
              - address
              - body
      responses:
        '200':
          description: The result of sending the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Whether the operation was successful
                  result:
                    type:
                    - object
                    - 'null'
                    properties:
                      '@type':
                        type: string
                        description: The type of the result
                      '@extra':
                        type: string
                        description: Extra information
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
