openapi: 3.0.3
info:
  title: Chainstack Arbitrum Node Account Info Tempo Specific API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the Arbitrum blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/<key>). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/arbitrum_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Tempo Specific
paths:
  /eth_sendRawTransactionSync:
    post:
      tags:
      - Tempo Specific
      summary: eth_sendRawTransactionSync
      operationId: tempo-eth-sendRawTransactionSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_sendRawTransactionSync
                params:
                  type: array
                  items: {}
                  default:
                  - '0xf867808502540e841e825208949729187d9e8bbefa8295f39f5634ca454dd9d294808083014b9da00602a6c9850068ac6667c098f65cf061e5e90d7030a63d13396dc6d0522fe517a07a0f9c9455612fcacfce60fba7c6e305728148f3ec345661535d0230f872f224'
                  description: Signed transaction data
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: The transaction receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    nullable: true
                    description: The transaction receipt object, returned once the transaction is included in a block
  /tempo_fundAddress:
    post:
      tags:
      - Tempo Specific
      summary: tempo_fundAddress
      operationId: tempo-tempo-fundAddress
      description: Funds an address with testnet stablecoins (pathUSD, AlphaUSD, BetaUSD, ThetaUSD). Testnet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: tempo_fundAddress
                params:
                  type: array
                  items: {}
                  default:
                  - '0xc2F695613de0885dA3bdd18E8c317B9fAf7d4eba'
                  description: The address to fund with testnet tokens
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Array of transaction hashes for each funded token
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: array
                    items:
                      type: string
                    description: Array of transaction hashes (one per funded token)
