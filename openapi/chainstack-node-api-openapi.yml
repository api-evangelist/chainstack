openapi: 3.0.3
info:
  title: Chainstack Arbitrum Account Info Node API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the Arbitrum blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/<key>). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/arbitrum_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Node
paths:
  /v1/nodes/:
    get:
      operationId: listAllNodes
      summary: List all Nodes
      description: List all nodes in the networks your organization is part of.
      parameters:
      - $ref: '#/components/parameters/NodeOrdering'
      - $ref: '#/components/parameters/Pagination'
      - $ref: '#/components/parameters/ProjectIdFilter'
      - $ref: '#/components/parameters/OrganizationIdFilter'
      - $ref: '#/components/parameters/NetworkIdFilter'
      - $ref: '#/components/parameters/RegionFilter'
      - $ref: '#/components/parameters/ProviderFilter'
      - $ref: '#/components/parameters/ProtocolFilter'
      - $ref: '#/components/parameters/NodeStatusFilter'
      - $ref: '#/components/parameters/NodeRoleFilter'
      - $ref: '#/components/parameters/NodeTypeFilter'
      - $ref: '#/components/parameters/ArchiveFilter'
      - $ref: '#/components/parameters/PublicNetworkNameFilter'
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/NetworkProjectTypeFilter'
      tags:
      - Node
      security:
      - APIKeyAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/Node'
              examples:
                list:
                  value:
                    count: 1
                    next: null
                    previous: null
                    results:
                    - id: ND-123-456-789
                      name: My Polygon PoS archive node
                      network: NW-123-456-7
                      organization: RG-123-456
                      type: dedicated
                      role: peer
                      provider: gcloud
                      region: asia-southeast1
                      status: running
                      configuration:
                        archive: true
                      details:
                        mode: archive
                        version: 1.0.6
                        api_namespaces:
                        - net
                        - eth
                        - web3
                        - txpool
                        - debug
                        - parlia
                        graphql_endpoint: https://nd-123-456-789.p2pify.com/graphql
                        https_endpoint: https://nd-123-456-789.p2pify.com
                        wss_endpoint: wss://ws-nd-123-456-789.p2pify.com
                        auth_username: user-name
                        auth_password: pass-word-pass-word-pass-word
                        auth_key: 3c6e0b8a9c15224a8228b9a98ca1531d
                      created_at: '2020-06-15T07:38:00.747Z'
                      creator:
                        id: UR-111-111-111
                        email: john.smith@example.com
                        first_name: John
                        last_name: Smith
                        organization:
                          id: RG-123-456
                          name: My organization
          description: ''
    post:
      operationId: createNode
      summary: Create Node
      description: Create Node
      tags:
      - Node
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreate'
            examples:
              ethereum:
                $ref: '#/components/examples/EthereumNodeCreate'
              polygon pos:
                $ref: '#/components/examples/PolygonPoSNodeCreate'
              bsc:
                $ref: '#/components/examples/BinanceSmartChainNodeCreate'
              avalanche:
                $ref: '#/components/examples/AvalancheNodeCreate'
              fantom:
                $ref: '#/components/examples/FantomNodeCreate'
              tezos:
                $ref: '#/components/examples/TezosNodeCreate'
              solana:
                $ref: '#/components/examples/SolanaNodeCreate'
              starknet:
                $ref: '#/components/examples/StarknetNodeCreate'
              bitcoin:
                $ref: '#/components/examples/BitcoinNodeCreate'
              harmony:
                $ref: '#/components/examples/HarmonyNodeCreate'
        required: true
      security:
      - APIKeyAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
              examples:
                ethereum:
                  $ref: '#/components/examples/EthereumNode'
                polygon pos:
                  $ref: '#/components/examples/PolygonPoSNode'
                bsc:
                  $ref: '#/components/examples/BinanceSmartChainNode'
                avalanche:
                  $ref: '#/components/examples/AvalancheNode'
                fantom:
                  $ref: '#/components/examples/FantomNode'
                tezos:
                  $ref: '#/components/examples/TezosNode'
                solana:
                  $ref: '#/components/examples/SolanaNode'
                starknet:
                  $ref: '#/components/examples/StarknetNode'
                bitcoin:
                  $ref: '#/components/examples/BitcoinNode'
                harmony:
                  $ref: '#/components/examples/HarmonyNode'
          description: ''
        '400':
          $ref: '#/components/responses/ValidationError'
  /v1/nodes/{id}/:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: retrieveNode
      summary: Retrieve Node
      description: Retrieve node details.
      tags:
      - Node
      security:
      - APIKeyAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
              examples:
                ethereum:
                  $ref: '#/components/examples/EthereumNode'
                polygon pos:
                  $ref: '#/components/examples/PolygonPoSNode'
                bsc:
                  $ref: '#/components/examples/BinanceSmartChainNode'
                avalanche:
                  $ref: '#/components/examples/AvalancheNode'
                fantom:
                  $ref: '#/components/examples/FantomNode'
                tezos:
                  $ref: '#/components/examples/TezosNode'
                solana:
                  $ref: '#/components/examples/SolanaNode'
                starknet:
                  $ref: '#/components/examples/StarknetNode'
                bitcoin:
                  $ref: '#/components/examples/BitcoinNode'
                harmony:
                  $ref: '#/components/examples/HarmonyNode'
          description: ''
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      operationId: updateNode
      summary: Update Node
      description: Change the node name.
      tags:
      - Node
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
            examples:
              node:
                value:
                  name: My new node name
      security:
      - APIKeyAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
              examples:
                ethereum:
                  $ref: '#/components/examples/EthereumNode'
                polygon pos:
                  $ref: '#/components/examples/PolygonPoSNode'
                bsc:
                  $ref: '#/components/examples/BinanceSmartChainNode'
                avalanche:
                  $ref: '#/components/examples/AvalancheNode'
                fantom:
                  $ref: '#/components/examples/FantomNode'
                tezos:
                  $ref: '#/components/examples/TezosNode'
                solana:
                  $ref: '#/components/examples/SolanaNode'
                starknet:
                  $ref: '#/components/examples/StarknetNode'
                bitcoin:
                  $ref: '#/components/examples/BitcoinNode'
                harmony:
                  $ref: '#/components/examples/HarmonyNode'
          description: ''
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      operationId: deleteNode
      summary: Delete Node
      description: Delete the node.
      tags:
      - Node
      security:
      - APIKeyAuthentication: []
      responses:
        '204':
          description: No response body
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    FantomNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/FantomNodeConfiguration'
      - type: object
        required:
        - archive
    StarknetNodeDetails:
      type: object
      description: StarkNet node details.
      properties:
        version:
          type: string
          readOnly: true
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    PolygonPoSNodeConfiguration:
      type: object
      description: Polygon PoS node configuration.
      properties:
        archive:
          type: boolean
          description: 'Pass `true` if you want to access full blockchain data and an archive of historical states.

            <br>See more about [archive nodes](https://docs.chainstack.com/operations/polygon/modes).

            '
    Provider:
      type: string
      enum:
      - aws
      - azure
      - gcloud
      - vzo
      description: 'Cloud provider.

        <br>See also [Supported cloud providers](https://docs.chainstack.com/platform/supported-cloud-hosting-providers).

        '
    EthereumNodeConfiguration:
      type: object
      description: Ethereum node configuration.
      properties:
        archive:
          type: boolean
          description: 'Pass `true` if you want to access full blockchain data and an archive of historical states.

            <br>See more about [archive nodes](https://docs.chainstack.com/operations/ethereum/modes).

            '
    SolanaNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/SolanaNodeConfiguration'
      - type: object
    NodeRoleCreateEnum:
      type: string
      description: Role of the node.
      enum:
      - peer
    Node:
      allOf:
      - $ref: '#/components/schemas/BaseNode'
      - type: object
        properties:
          role:
            $ref: '#/components/schemas/NodeRoleEnum'
          configuration:
            $ref: '#/components/schemas/NodeConfiguration'
    PolygonPoSNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/PolygonPoSNodeConfiguration'
      - type: object
        required:
        - archive
    NodeDetails:
      oneOf:
      - $ref: '#/components/schemas/EthereumNodeDetails'
      - $ref: '#/components/schemas/BinanceSmartChainNodeDetails'
      - $ref: '#/components/schemas/AvalancheNodeDetails'
      - $ref: '#/components/schemas/FantomNodeDetails'
      - $ref: '#/components/schemas/TezosNodeDetails'
      - $ref: '#/components/schemas/SolanaNodeDetails'
      - $ref: '#/components/schemas/StarknetNodeDetails'
      - $ref: '#/components/schemas/BitcoinNodeDetails'
      - $ref: '#/components/schemas/HarmonyNodeDetails'
      readOnly: true
    AvalancheNodeConfiguration:
      type: object
      description: Avalanche node configuration.
      properties:
        archive:
          type: boolean
          description: 'Pass `true` if you want to access full blockchain data and an archive of historical states.

            <br>See more about [archive nodes](https://docs.chainstack.com/operations/avalanche/modes).

            '
    Region:
      type: string
      enum:
      - asia-southeast1
      - ap-southeast-1
      - us-west-2
      - us-east-1
      - uksouth
      - eu3
      description: 'Regions the nodes are deployed to.


        Available for `gcloud`:

        * `asia-southeast1`


        Available for `aws`:

        * `ap-southeast-1`

        * `us-west-2`

        * `us-east-1`


        Available for `azure`:

        * `uksouth`


        Available for `vzo`:

        * `eu3`

        '
    NodeCreateConfiguration:
      oneOf:
      - $ref: '#/components/schemas/EthereumNodeCreateConfiguration'
      - $ref: '#/components/schemas/PolygonPoSNodeCreateConfiguration'
      - $ref: '#/components/schemas/BinanceSmartChainNodeCreateConfiguration'
      - $ref: '#/components/schemas/AvalancheNodeCreateConfiguration'
      - $ref: '#/components/schemas/FantomNodeCreateConfiguration'
      - $ref: '#/components/schemas/TezosNodeCreateConfiguration'
      - $ref: '#/components/schemas/SolanaNodeCreateConfiguration'
      - $ref: '#/components/schemas/StarknetNodeCreateConfiguration'
      - $ref: '#/components/schemas/HarmonyNodeCreateConfiguration'
    Protocol:
      type: string
      enum:
      - ethereum
      - polygon-pos
      - bsc
      - avalanche
      - arbitrum
      - near
      - aurora
      - gnosis
      - cronos
      - fantom
      - starknet
      - harmony
      - tezos
      - fuse
      - bitcoin
      description: 'Protocol.

        <br>See also [Supported protocols](https://docs.chainstack.com/platform/supported-protocols).

        '
    FantomNodeDetails:
      type: object
      description: Fantom node details.
      properties:
        version:
          type: string
          readOnly: true
        api_namespaces:
          type: array
          readOnly: true
          items:
            type: string
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        wss_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        graphql_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    EthereumNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/EthereumNodeConfiguration'
      - type: object
        required:
        - archive
    TezosNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/TezosNodeConfiguration'
      - type: object
        required:
        - archive
        - tezos_node_type
    BitcoinNodeDetails:
      type: object
      description: Bitcoin node details.
      properties:
        version:
          type: string
          readOnly: true
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoint.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoint.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoint.

            <br>Only for the owner of the node.

            '
    EthereumNodeDetails:
      type: object
      description: Ethereum node details.
      properties:
        mode:
          type: string
          description: See also [Ethereum node modes](https://docs.chainstack.com/operations/ethereum/modes)
          readOnly: true
          enum:
          - full
          - archive
        version:
          type: string
          readOnly: true
        api_namespaces:
          type: array
          readOnly: true
          items:
            type: string
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        wss_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        beacon_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        graphql_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    AvalancheNodeDetails:
      type: object
      description: Avalanche node details.
      properties:
        version:
          type: string
          readOnly: true
        api_namespaces:
          type: array
          readOnly: true
          items:
            type: string
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        wss_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    NodeStatusEnum:
      type: string
      description: 'See more about [statuses](https://docs.chainstack.com/platform/view-node-and-network-status).

        '
      readOnly: true
      enum:
      - pending
      - running
      - maintenance
      - failed
      - error
      - stopping
      - stopped
      - starting
    NodeRoleEnum:
      type: string
      description: 'Role of the node.

        <br>Available roles:

        * `peer` — peer node

        '
      enum:
      - peer
    BinanceSmartChainNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/BinanceSmartChainNodeConfiguration'
      - type: object
        required:
        - archive
    NodeUpdate:
      allOf:
      - $ref: '#/components/schemas/BaseNode'
      - type: object
        properties:
          configuration:
            $ref: '#/components/schemas/NodeConfiguration'
          type:
            readOnly: true
          role:
            allOf:
            - $ref: '#/components/schemas/NodeRoleEnum'
            readOnly: true
          provider:
            readOnly: true
          region:
            readOnly: true
          network:
            readOnly: true
    StarknetNodeConfiguration:
      type: object
      description: StarkNet node configuration.
    ProjectTypeEnum:
      type: string
      description: 'Type of the project.

        <br>

        * `public` for public chain project

        '
      enum:
      - public
    TezosNodeConfiguration:
      type: object
      description: Tezos node configuration.
      properties:
        archive:
          type: boolean
          description: 'Pass `true` if you want to access full blockchain data and an archive of historical states.

            <br>See more about [archive nodes](https://docs.chainstack.com/operations/tezos/modes).

            '
        tezos_node_type:
          type: string
          description: 'Currently ''regular'' is the only supported type.

            '
    Creator:
      type: object
      description: Creator of the object.
      readOnly: true
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/Object'
          description: Creator's organization.
    FantomNodeConfiguration:
      type: object
      description: Fantom node configuration.
      properties:
        archive:
          type: boolean
          description: 'Pass `true` if you want to access full blockchain data and an archive of historical states.

            <br>See more about [archive nodes](https://docs.chainstack.com/operations/fantom/modes).

            '
    NodeTypeEnum:
      type: string
      description: 'Type of the node.

        <br>Available types:

        * `shared` — only for `ethereum`, `polygon-pos`, `bsc`, `avalanche`, `fantom`, `tezos`, `bitcoin`

        * `dedicated` — for all protocols

        '
      enum:
      - shared
      - dedicated
    Object:
      type: object
      description: Common object representation.
      readOnly: true
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
    AvalancheNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/AvalancheNodeConfiguration'
      - type: object
        required:
        - archive
    TezosNodeDetails:
      type: object
      description: Tezos node details.
      properties:
        version:
          type: string
          readOnly: true
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    NodeCreate:
      allOf:
      - $ref: '#/components/schemas/BaseNode'
      - type: object
        properties:
          role:
            $ref: '#/components/schemas/NodeRoleCreateEnum'
          configuration:
            allOf:
            - $ref: '#/components/schemas/NodeCreateConfiguration'
            description: 'Protocol-specific parameters.

              <br>Pass `{}` if there are no specific parameters for the selected protocol.

              '
        required:
        - name
        - network
        - region
        - provider
        - role
        - type
        - configuration
    HarmonyNodeDetails:
      type: object
      description: Harmony node details.
      properties:
        version:
          type: string
          readOnly: true
        api_namespaces:
          type: array
          readOnly: true
          items:
            type: string
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        wss_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    BinanceSmartChainNodeDetails:
      type: object
      description: Binance Smart Chain node details.
      properties:
        mode:
          type: string
          description: See also [Binance Smart Chain node modes](https://docs.chainstack.com/operations/bsc/modes)
          readOnly: true
          enum:
          - full
          - archive
        version:
          type: string
          readOnly: true
        api_namespaces:
          type: array
          readOnly: true
          items:
            type: string
        https_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        wss_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        graphql_endpoint:
          type: string
          readOnly: true
          description: Only for the owner of the node.
        auth_username:
          type: string
          readOnly: true
          description: 'Basic authentication username to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_password:
          type: string
          format: password
          readOnly: true
          description: 'Basic authentication password to access the node endpoints.

            <br>Only for the owner of the node.

            '
        auth_key:
          type: string
          format: password
          readOnly: true
          description: 'Authentication key to access the node endpoints.

            <br>Only for the owner of the node.

            '
    SolanaNodeConfiguration:
      type: object
      description: Solana node configuration.
    HarmonyNodeCreateConfiguration:
      allOf:
      - $ref: '#/components/schemas/HarmonyNodeConfiguration'
      - type: object
        required:
        - archive
    NodeConfiguration:
      oneOf:
      - $ref: '#/components/schemas/EthereumNodeConfiguration'
      - $ref: '#/components/schemas/PolygonPoSNodeConfiguration'
      - $ref: '#/components/schemas/BinanceSmartChainNodeConfiguration'
