openapi: 3.2.0
info:
  title: Chainstack Polygon zkEVM Node Zkevm Methods API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the Polygon zkEVM blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/<key>). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/polygon_zkevm_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Zkevm Methods
paths:
  /zkevm_batchNumber:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_batchNumber
      operationId: zkevm_batchNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_batchNumber
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: Returns the current batch number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_batchNumberByBlockNumber:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_batchNumberByBlockNumber
      operationId: zkevm_batchNumberByBlockNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_batchNumberByBlockNumber
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0xD65B'
      responses:
        '200':
          description: Returns the batch number associated with the given block number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_consolidatedBlockNumber:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_consolidatedBlockNumber
      operationId: zkevm_consolidatedBlockNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_consolidatedBlockNumber
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: The latest consolidated block number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_getBatchByNumber:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_getBatchByNumber
      operationId: zkevm_getBatchByNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_getBatchByNumber
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0x1FC0'
      responses:
        '200':
          description: Returns information about a specific batch of transactions based on the batch number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_isBlockConsolidated:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_isBlockConsolidated
      operationId: zkevm_isBlockConsolidated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_isBlockConsolidated
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0xd29e'
      responses:
        '200':
          description: Checks if the given block is consolidated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_isBlockVirtualized:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_isBlockVirtualized
      operationId: zkevm_isBlockVirtualized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_isBlockVirtualized
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '130000'
      responses:
        '200':
          description: Checks if the given block is virtualized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_verifiedBatchNumber:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_verifiedBatchNumber
      operationId: zkevm_verifiedBatchNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_verifiedBatchNumber
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: Returns the current verified batch number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /zkevm_virtualBatchNumber:
    post:
      tags:
      - Zkevm Methods
      summary: zkevm_virtualBatchNumber
      operationId: zkevm_virtualBatchNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: zkevm_virtualBatchNumber
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: Returns the current virtual batch number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
