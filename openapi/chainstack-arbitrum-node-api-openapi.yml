  /arbtrace_block:
    post:
      tags:
      - Debug And Trace
      summary: Arbtrace_Block
      operationId: arbtraceBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: arbtrace_block
                params:
                  type: array
                  items:
                    type: string
                    title: Block Identifier
                  default:
                  - '0xE4E1C0'
      responses:
        '200':
          description: The result of the arbtrace_block method.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /arbtrace_call:
    post:
      tags:
      - Debug And Trace
      summary: Arbtrace_Call
      operationId: arbtraceCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: arbtrace_call
                params:
                  type: array
                  items:
                    anyOf:
                    - type: object
                      title: Transaction call Object
                    - type: array
                      items:
                        type: string
                      title: Options Array
                    - type: string
                      title: Block Identifier
                  default:
                  - from: '0xeff678bf68ca0da9dfdac0c88f431e8d0e2f7116'
                    to: '0x1b02da8cb0d097eb8d57a175b88c7d8b47997506'
                    gas: '0xfa4d9'
                    gasPrice: '0x9c1e25d'
                    data: ''
                  - - trace
                  - '0xE4E1C0'
      responses:
        '200':
          description: The call's trace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /arbtrace_callMany:
    post:
      tags:
      - Debug And Trace
      summary: arbtrace_callMany
      operationId: arbtraceCallMany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: arbtrace_callMany
                params:
                  type: array
                  items:
                    anyOf:
                    - type: array
                      items:
                        type: array
                        items:
                          anyOf:
                          - type: object
                            title: Transaction call Object
                          - type: array
                            items:
                              type: string
                            title: Options Array
                    - type: string
                      title: Block Identifier
                  default:
                  - - - from: '0xb8351B61Fa1Eb007A9f80144C489d513e6A76b14'
                        to: '0x478fa4C971a077038B4Fc5C172c3Af5552224ccc'
                        value: '0xb1a2bc2ec50000'
                      - - trace
                    - - from: '0xb8351B61Fa1Eb007A9f80144C489d513e6A76b14'
                        to: '0x988aA44E12c7BCE07E449A4156b4A269d6642B3A'
                        value: '0x6f05b59d3b20000'
                      - - trace
                  - latest
      responses:
        '200':
          description: The calls' traces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /arbtrace_filter:
    post:
      tags:
      - Debug And Trace
      summary: Arbtrace_Filter
      operationId: arbtraceFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: arbtrace_filter
                params:
                  type: array
                  items:
                    type: object
                    properties:
                      fromBlock:
                        type: string
                        title: From Block Identifier
                      toBlock:
                        type: string
                        title: To Block Identifier
                    required:
                    - fromBlock
                    - toBlock
                  default:
                  - fromBlock: '0xE4E1C0'
                    toBlock: '0xE4E1C2'
      responses:
        '200':
          description: The result of the arbtrace_filter method.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /arbtrace_get:
