openapi: 3.0.3
info:
  title: Chainstack Arbitrum Node API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the Arbitrum blockchain. Endpoints follow the canonical JSON-RPC over HTTPS
    interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/<key>).
    Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/arbitrum_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Accounts Info
- name: Blocks Info
- name: Chain Info
- name: Client Info
- name: Debug And Trace
- name: Execute Transactions
- name: Filter Handling
- name: Gas Data
- name: Logs And Events
- name: Transaction Info
paths:
  /eth_getBalance:
    post:
      tags:
      - Accounts Info
      summary: eth_getBalance
      operationId: getBalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBalance
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Address
                      description: The address identifier.
                    - type: string
                      title: Block identifier
                      description: The block identifier.
                  default:
                  - '0x13867a801e352e219c2d2AC29288Bf086e5C81ef'
                  - pending
      responses:
        '200':
          description: The account balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getCode:
    post:
      tags:
      - Accounts Info
      summary: eth_getCode
      operationId: getCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getCode
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Smart contract address
                      description: The address identifier.
                    - type: string
                      title: Block identifier
                      description: The block identifier.
                  default:
                  - '0xFa7F8980b0f1E64A2062791cc3b0871572f1F7f0'
                  - latest
      responses:
        '200':
          description: The smart contract code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getStorageAt:
    post:
      tags:
      - Accounts Info
      summary: eth_getStorageAt
      operationId: getStorageAt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  default: eth_getStorageAt
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Smart contract address
                      description: The address of the contract to query.
                    - type: string
                      title: Slot index
                      description: The index of the storage position to query.
                    - type: string
                      title: Block ID
                      description: The block number or tag to use as a reference.
                  default:
                  - '0x92c5dfaA4f5083914b1191a4618Ec35506C1CE16'
                  - '0x0'
                  - latest
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
      responses:
        '200':
          description: The value stored at the specified position.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_getTransactionCount:
    post:
      tags:
      - Accounts Info
      summary: eth_getTransactionCount
      operationId: getTransactionCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionCount
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Address
                      description: The address to check
                    - type: string
                      title: Block identifier
                      description: The block identifier
                  default:
                  - '0x13867a801e352e219c2d2AC29288Bf086e5C81ef'
                  - latest
      responses:
        '200':
          description: The address nonce
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_blockNumber:
    post:
      tags:
      - Blocks Info
      summary: eth_blockNumber
      operationId: eth_blockNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_blockNumber
                params:
                  type: array
                  default: []
      responses:
        '200':
          description: The latest block number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getBlockByHash:
    post:
      tags:
      - Blocks Info
      summary: eth_getBlockByHash
      operationId: getBlockByHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockByHash
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Block Hash
                      description: The hash identifying the block.
                    - type: boolean
                      title: Transaction selector
                      description: True for the full transactions, false for only the transaction hashes.
                  default:
                  - '0x7ccd0791880035667dfee8244ab96d9c091668859e9e72ded4890e6efde68b25'
                  - false
      responses:
        '200':
          description: The block information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getBlockByNumber:
    post:
      tags:
      - Blocks Info
      summary: eth_getBlockByNumber
      operationId: getBlockByNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockByNumber
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      title: Block identifier
                      description: The block number or tag.
                    - type: boolean
                      title: Transaction selector
                      description: True for the full transactions, false for only the transaction hashes.
                  default:
                  - latest
                  - false
      responses:
        '200':
          description: The block information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getBlockTransactionCountByHash:
    post:
      tags:
      - Blocks Info
      summary: eth_getBlockTransactionCountByHash
