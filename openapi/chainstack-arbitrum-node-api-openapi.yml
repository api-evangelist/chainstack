      responses:
        '200':
          description: The block transaction count information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
  /eth_newBlockFilter:
    post:
      summary: eth_newBlockFilter
      operationId: newBlockFilter
      requestBody:
