openapi: 3.2.0
info:
  title: Chainstack TON Node Get Masterchain Block Signatures API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetMasterchainBlockSignatures
paths:
  /getMasterchainBlockSignatures:
    get:
      tags:
      - GetMasterchainBlockSignatures
      summary: getMasterchainBlockSignatures
      operationId: getMasterchainBlockSignatures
      parameters:
      - name: seqno
        in: query
        required: true
        description: The sequence number of the masterchain block
        schema:
          type: integer
          default: 39064874
        example: 39064874
      responses:
        '200':
          description: Signatures of the specified masterchain block
          content:
            application/json:
              schema:
                type: object
                properties:
                  signatures:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id:
                          type: string
                          description: The ID of the validator node
                        r:
                          type: string
                          description: The 'r' component of the signature
                        s:
                          type: string
                          description: The 's' component of the signature
                  validator_set_hash:
                    type: string
                    description: The hash of the validator set
                  catchain_seqno:
                    type: integer
                    description: The sequence number in the catchain
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
