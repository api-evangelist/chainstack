openapi: 3.2.0
info:
  title: Chainstack TON Node Get Shard Block Proof API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetShardBlockProof
paths:
  /getShardBlockProof:
    get:
      tags:
      - GetShardBlockProof
      summary: getShardBlockProof
      operationId: getShardBlockProof
      parameters:
      - name: workchain
        in: query
        required: true
        description: The workchain ID
        schema:
          type: integer
          default: -1
        example: -1
      - name: shard
        in: query
        required: true
        description: The shard ID
        schema:
          type: string
          default: '-9223372036854775808'
        example: '-9223372036854775808'
      - name: seqno
        in: query
        required: true
        description: The sequence number of the block
        schema:
          type: integer
          default: 39064874
        example: 39064874
      responses:
        '200':
          description: Proof of the specified shard block
          content:
            application/json:
              schema:
                type: object
                properties:
                  masterchain_block_root_hash:
                    type: string
                    description: The root hash of the masterchain block
                  masterchain_block_seq_no:
                    type: integer
                    description: The sequence number of the masterchain block
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          description: The source block hash
                        to:
                          type: string
                          description: The destination block hash
                        dest_proof:
                          type: string
                          description: The proof of the destination block
                        proof:
                          type: string
                          description: The proof of the link
                  block_header:
                    type: string
                    description: The header of the shard block
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
