openapi: 3.2.0
info:
  title: Chainstack TON Node Get Multisig Wallets API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetMultisigWallets
paths:
  /getMultisigWallets:
    get:
      summary: Get Multisig Wallets
      description: Get multisig wallet contracts and their configuration
      operationId: getMultisigWallets
      tags:
      - GetMultisigWallets
      parameters:
      - name: address
        in: query
        description: Multisig wallet address
        schema:
          type: string
      - name: proposer_address
        in: query
        description: Filter by proposer address
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of wallets to return
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of wallets to skip
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  multisig_wallets:
                    type: array
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                          description: Multisig wallet address
                        seqno:
                          type: integer
                          description: Current sequence number
                        threshold:
                          type: integer
                          description: Required number of signatures
                        signers:
                          type: array
                          items:
                            type: string
                          description: List of signer addresses
                        proposers:
                          type: array
                          items:
                            type: string
                          description: List of proposer addresses
                        orders_count:
                          type: integer
                          description: Number of pending orders
                  address_book:
                    type: object
                    description: Address book mapping
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
