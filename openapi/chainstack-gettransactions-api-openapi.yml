openapi: 3.2.0
info:
  title: Chainstack TON Node Get Transactions API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetTransactions
paths:
  /getTransactions:
    get:
      tags:
      - GetTransactions
      summary: getTransactions
      operationId: getTransactions
      parameters:
      - name: address
        in: query
        required: true
        description: The address to get transactions for
        schema:
          type: string
          default: EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2
        example: EQDtFpEwcFAEcRe5mLVh2N6C0x-_hJEM7W61_JLnSF74p4q2
      - name: limit
        in: query
        required: false
        description: The maximum number of transactions to return
        schema:
          type: integer
          default: 10
        example: 10
      - name: to_lt
        in: query
        required: false
        description: The logical time to start the search from (0 means from the latest)
        schema:
          type: integer
          default: 0
        example: 0
      - name: archival
        in: query
        required: false
        description: Whether to use archival node for the query
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          description: Transaction history for the specified address
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    transaction_id:
                      type: object
                      properties:
                        lt:
                          type: string
                          description: The logical time of the transaction
                        hash:
                          type: string
                          description: The hash of the transaction
                    utime:
                      type: integer
                      description: Unix timestamp of the transaction
                    fee:
                      type: string
                      description: The fee for the transaction in nanotons
                    storage_fee:
                      type: string
                      description: The storage fee for the transaction in nanotons
                    other_fee:
                      type: string
                      description: Other fees for the transaction in nanotons
                    transaction_type:
                      type: string
                      description: The type of the transaction
                    compute:
                      type: object
                      description: Computation details of the transaction
                    action:
                      type: object
                      description: Action details of the transaction
                    in_msg:
                      type: object
                      description: Details of the incoming message
                    out_msgs:
                      type: array
                      description: Details of the outgoing messages
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
