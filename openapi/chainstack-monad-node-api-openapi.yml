          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockByNumber
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      description: Block number in hexadecimal format or 'latest', 'earliest', 'pending'
                    - type: boolean
                      description: If true, returns full transaction objects; if false, returns only transaction hashes
                  default:
                  - latest
                  - false
      responses:
        '200':
          description: The block information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
