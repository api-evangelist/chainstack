  /eth_getBlockByHash:
    post:
      tags:
      - Blocks Info
      summary: eth_getBlockByHash
      operationId: eth_getBlockByHash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBlockByHash
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      description: The block hash
                    - type: boolean
                      description: If true, returns full transaction objects; if false, returns only transaction hashes
                  default:
                  - '0xf3cf930f1b4d9637134d09f126c57c30c3f4f40edf10ba502486b26d14b4f944'
                  - false
      responses:
        '200':
          description: The block information.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    nullable: true
  /eth_getBlockByNumber:
    post:
