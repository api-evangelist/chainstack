            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getCode
                params:
                  type: array
                  items:
                    type: string
                  default:
                  - '0xAc586b65F3cd0627D2D05AdB8EF551C9d2D76E12'
