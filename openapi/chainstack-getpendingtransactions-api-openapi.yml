openapi: 3.2.0
info:
  title: Chainstack TON Node Get Pending Transactions API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetPendingTransactions
paths:
  /getPendingTransactions:
    get:
      summary: Get Pending Transactions
      description: Get transactions that are pending finalization
      operationId: getPendingTransactions
      tags:
      - GetPendingTransactions
      parameters:
      - name: account
        in: query
        description: Filter by account address
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of transactions to return
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of transactions to skip
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        account:
                          type: string
                          description: Account address
                        hash:
                          type: string
                          description: Transaction hash
                        lt:
                          type: integer
                          description: Logical time
                        now:
                          type: integer
                          description: Unix timestamp
                        mc_block_seqno:
                          type: integer
                          description: Masterchain block sequence number
                        trace_id:
                          type: string
                          description: Associated trace ID
                  address_book:
                    type: object
                    description: Address book mapping
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
