openapi: 3.2.0
info:
  title: Chainstack TON Node Get Account Info API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetAccountInfo
paths:
  /getAccountInfo:
    get:
      summary: Get Account Information
      description: Retrieves information about a specific account on the TON blockchain
      operationId: getAccountInfo
      tags:
      - GetAccountInfo
      parameters:
      - name: address
        in: query
        description: The address of the account to retrieve information for
        required: true
        schema:
          type: string
          default: Ef-1JetbPF9ubc1ga-57oHoOyDA1IShJt-BVlJnA9rrVTfrB
        example: Ef-1JetbPF9ubc1ga-57oHoOyDA1IShJt-BVlJnA9rrVTfrB
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    description: The account address
                  balance:
                    type: string
                    description: The account balance in nanotons
                  last_activity:
                    type: integer
                    description: The timestamp of the last account activity
                  status:
                    type: string
                    description: The status of the account (e.g., active, frozen)
                  code_hash:
                    type: string
                    description: The hash of the account's code
                  data_hash:
                    type: string
                    description: The hash of the account's data
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
