openapi: 3.2.0
info:
  title: Chainstack TON Node Get Consensus Block API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetConsensusBlock
paths:
  /getConsensusBlock:
    get:
      tags:
      - GetConsensusBlock
      summary: getConsensusBlock
      operationId: getConsensusBlock
      responses:
        '200':
          description: Information about the latest consensus block
          content:
            application/json:
              schema:
                type: object
                properties:
                  consensus_block:
                    type: integer
                    description: The sequence number of the latest consensus block
                  timestamp:
                    type: integer
                    description: The Unix timestamp of the latest consensus block
                  timestamp_string:
                    type: string
                    description: The human-readable timestamp of the latest consensus block
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
