          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_call
                params:
                  type: array
                  items: {}
                  default:
                  - to: '0x20c0000000000000000000000000000000000000'
                    data: '0x70a082310000000000000000000000009729187d9e8bbefa8295f39f5634ca454dd9d294'
                  - latest
                  description: Transaction call object and block parameter
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: The return value of the executed contract call
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
                    description: The return data of the call
  /eth_createAccessList:
    post:
      tags:
      - Transaction Info
      summary: eth_createAccessList
      operationId: tempo-eth-createAccessList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_createAccessList
                params:
                  type: array
                  items: {}
                  default:
                  - to: '0x20c0000000000000000000000000000000000000'
                    data: '0x95d89b41'
                  - latest
                  description: Method parameters
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    description: Method result
  /eth_sendRawTransaction:
    post:
      tags:
      - Transaction Info
      summary: eth_sendRawTransaction
      operationId: tempo-eth-sendRawTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_sendRawTransaction
                params:
                  type: array
                  items: {}
                  default:
                  - '0xf867808502540e841e825208949729187d9e8bbefa8295f39f5634ca454dd9d294808083014b9da00602a6c9850068ac6667c098f65cf061e5e90d7030a63d13396dc6d0522fe517a07a0f9c9455612fcacfce60fba7c6e305728148f3ec345661535d0230f872f224'
                  description: Signed transaction data
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: The transaction hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: string
                    description: The transaction hash
