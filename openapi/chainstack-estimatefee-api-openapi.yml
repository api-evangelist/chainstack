openapi: 3.2.0
info:
  title: Chainstack TON Node Estimate Fee API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: EstimateFee
paths:
  /estimateFee:
    post:
      tags:
      - EstimateFee
      summary: estimateFee
      operationId: estimateFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: The address to send the message from
                  default: EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs
                body:
                  type: string
                  description: The body of the message in base64 format
                  default: te6cckEBAQEAAgAAAEysuc0=
                init_code:
                  type: string
                  description: Optional init code in base64 format for contract deployment
                init_data:
                  type: string
                  description: Optional init data in base64 format for contract deployment
                ignore_chksig:
                  type: boolean
                  description: Whether to ignore the signature check
                  default: true
              required:
              - address
              - body
      responses:
        '200':
          description: The estimated fee for the message
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Whether the operation was successful
                  result:
                    type: object
                    properties:
                      '@type':
                        type: string
                        description: The type of the result
                      source_fees:
                        type: object
                        properties:
                          '@type':
                            type: string
                          in_fwd_fee:
                            type: integer
                            description: The incoming forward fee
                          storage_fee:
                            type: integer
                            description: The storage fee
                          gas_fee:
                            type: integer
                            description: The gas fee
                          fwd_fee:
                            type: integer
                            description: The forward fee
                      destination_fees:
                        type: array
                        items:
                          type: object
                        description: Array of destination fees
                      '@extra':
                        type: string
                        description: Extra information
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
