openapi: 3.2.0
info:
  title: Chainstack TON Node JSON RPC API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: JsonRPC
paths:
  /jsonRPC:
    post:
      tags:
      - JsonRPC
      summary: Jsonrpc Handler
      description: All methods in the API are available through JSON-RPC protocol (spec).
      operationId: jsonrpc_handler_jsonRPC_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TonRequestJsonRPC'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecatedTonResponseJsonRPC'
        '422':
          description: Validation Error
        '504':
          description: Lite Server Timeout
      security:
      - APIKeyHeader: []
      - APIKeyQuery: []
components:
  schemas:
    DeprecatedTonResponseJsonRPC:
      properties:
        ok:
          type: boolean
          title: Ok
        result:
          title: Result
        error:
          type: string
          title: Error
        code:
          type: integer
          title: Code
        id:
          type: string
          title: Id
        jsonrpc:
          type: string
          title: Jsonrpc
          default: '2.0'
      type: object
      required:
      - ok
      - id
      title: DeprecatedTonResponseJsonRPC
    TonRequestJsonRPC:
      properties:
        method:
          type: string
          title: Method
        params:
          type: object
          title: Params
          default: {}
        id:
          type: string
          title: Id
        jsonrpc:
          type: string
          title: Jsonrpc
      type: object
      required:
      - method
      title: TonRequestJsonRPC
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
