                  default: '2.0'
                method:
                  type: string
                  default: getBalance
                params:
                  type: array
                  items:
                    type: string
                    description: The public key of the account
                    default: 9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM
                  default:
                  - 9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM
      responses:
        '200':
          description: Account balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /getBlock:
    post:
      tags:
      - General
      summary: getBlock
      operationId: getBlock
      requestBody:
        required: true
