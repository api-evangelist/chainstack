                  default: '2.0'
                method:
                  type: string
                  default: getBlock
                params:
                  type: array
                  items:
                    oneOf:
                    - type: integer
                      description: The slot of the block
                      default: 239462061
                    - type: object
                      properties:
                        encoding:
                          type: string
                          default: jsonParsed
                        maxSupportedTransactionVersion:
                          type: integer
                          default: 0
                  default:
                  - 239462061
                  - encoding: jsonParsed
                    maxSupportedTransactionVersion: 0
      responses:
        '200':
          description: Block details
          content:
            application/json:
              schema:
