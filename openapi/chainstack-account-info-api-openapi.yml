openapi: 3.0.3
info:
  title: Chainstack Arbitrum Node Account Info API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the Arbitrum blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/<key>). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/arbitrum_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: Account Info
paths:
  /eth_getBalance:
    post:
      tags:
      - Account Info
      summary: eth_getBalance
      operationId: getBalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getBalance
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      default: '0xA507fF8a59De851134BC44063840A334A243a99E'
                    - type: string
                      default: latest
                  default:
                  - '0xA507fF8a59De851134BC44063840A334A243a99E'
                  - latest
      responses:
        '200':
          description: The balance information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getCode:
    post:
      tags:
      - Account Info
      summary: eth_getCode
      operationId: getCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getCode
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      default: '0xb0897686c545045aFc77CF20eC7A532E3120E0F1'
                    - type: string
                      default: latest
                  default:
                  - '0xb0897686c545045aFc77CF20eC7A532E3120E0F1'
                  - latest
      responses:
        '200':
          description: The code information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getStorageAt:
    post:
      tags:
      - Account Info
      summary: eth_getStorageAt
      operationId: getStorageAt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  default: eth_getStorageAt
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      default: '0xAE975071Be8F8eE67addBC1A82488F1C24858067'
                    - type: string
                      default: '0x0'
                    - type: string
                      default: latest
                  default:
                  - '0xAE975071Be8F8eE67addBC1A82488F1C24858067'
                  - '0x0'
                  - latest
      responses:
        '200':
          description: The storage information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_getTransactionCount:
    post:
      tags:
      - Account Info
      summary: eth_getTransactionCount
      operationId: getTransactionCount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  default: 1
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getTransactionCount
                params:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      default: '0xe341b2f448eb190495ed4a89c01f20078b26b0f6'
                    - type: string
                      default: latest
                  default:
                  - '0xe341b2f448eb190495ed4a89c01f20078b26b0f6'
                  - latest
      responses:
        '200':
          description: The transaction count information
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
  /eth_accounts:
    post:
      tags:
      - Account Info
      summary: Eth_Accounts
      operationId: tempo-eth-accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_accounts
                params:
                  type: array
                  items: {}
                  default: []
                  description: Method parameters
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    description: Method result
  /eth_getProof:
    post:
      tags:
      - Account Info
      summary: eth_getProof
      operationId: tempo-eth-getProof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  default: '2.0'
                method:
                  type: string
                  default: eth_getProof
                params:
                  type: array
                  items: {}
                  default:
                  - '0x20c0000000000000000000000000000000000000'
                  - - '0x0'
                  - latest
                  description: Address, storage keys array, and block parameter
                id:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Account and storage proof
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    description: Proof object with account proof and storage proofs
