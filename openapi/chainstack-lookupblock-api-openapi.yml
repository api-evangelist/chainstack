openapi: 3.2.0
info:
  title: Chainstack TON Node Lookup Block API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: LookupBlock
paths:
  /lookupBlock:
    get:
      tags:
      - LookupBlock
      summary: lookupBlock
      operationId: lookupBlock
      parameters:
      - name: workchain
        in: query
        required: true
        description: The workchain ID
        schema:
          type: integer
          default: -1
        example: -1
      - name: shard
        in: query
        required: true
        description: The shard ID
        schema:
          type: string
          default: '-9223372036854775808'
        example: '-9223372036854775808'
      - name: seqno
        in: query
        required: true
        description: The sequence number of the block
        schema:
          type: integer
          default: 39064874
        example: 39064874
      responses:
        '200':
          description: Information about the specified block
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: object
                    properties:
                      workchain:
                        type: integer
                        description: The workchain ID of the block
                      shard:
                        type: string
                        description: The shard ID of the block
                      seqno:
                        type: integer
                        description: The sequence number of the block
                      root_hash:
                        type: string
                        description: The root hash of the block
                      file_hash:
                        type: string
                        description: The file hash of the block
                  status:
                    type: integer
                    description: The status of the block
                  global_id:
                    type: integer
                    description: The global ID of the block
                  version:
                    type: integer
                    description: The version of the block
                  after_merge:
                    type: boolean
                    description: Whether the block was created after a merge
                  before_split:
                    type: boolean
                    description: Whether the block was created before a split
                  want_merge:
                    type: boolean
                    description: Whether the block wants to merge
                  want_split:
                    type: boolean
                    description: Whether the block wants to split
                  gen_utime:
                    type: integer
                    description: The generation time of the block
                  start_lt:
                    type: string
                    description: The start logical time of the block
                  end_lt:
                    type: string
                    description: The end logical time of the block
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
