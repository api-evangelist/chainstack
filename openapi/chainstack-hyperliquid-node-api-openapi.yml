                          s:
                            type: string
                          v:
                            type: integer
                    payload:
                      type: object
                      description: Multi-sig payload containing the inner action
                      properties:
                        multiSigUser:
                          type: string
                          description: Address of the multi-sig user
                        outerSigner:
                          type: string
                          description: Address of the signer submitting the transaction
                        action:
                          type: object
                          description: The inner action to execute (e.g., order, cancel, etc.)
                  required:
                  - type
                  - signatureChainId
                  - signatures
                  - payload
                nonce:
                  type: integer
                  description: Current timestamp in milliseconds
                signature:
                  type: object
