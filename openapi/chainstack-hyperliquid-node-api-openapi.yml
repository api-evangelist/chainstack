                  description: The request type. Must be 'recentTrades' to retrieve recent trades.
                coin:
                  type: string
                  default: BTC
                  description: Asset identifier (simple names like 'BTC', 'ETH' for perpetuals; spot format like '@107' for
                    spot trades)
