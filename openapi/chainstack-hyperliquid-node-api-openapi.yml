    post:
      tags:
      - General
      summary: Schedule cancel (dead man's switch)
      operationId: scheduleCancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: object
                  properties:
                    type:
                      type: string
                      default: scheduleCancel
                      enum:
                      - scheduleCancel
                      description: Action type for scheduling automatic cancellation
                    time:
                      type: integer
                      description: Unix timestamp in milliseconds when to cancel all orders. Omit to remove existing scheduled
                        cancel
                  required:
                  - type
                nonce:
                  type: integer
                  description: Current timestamp in milliseconds
                signature:
                  type: object
                  description: EIP-712 signature of the action with r, s, v components
                  properties:
                    r:
                      type: string
                      description: ECDSA signature r component (hex string)
                      example: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                    s:
                      type: string
                      description: ECDSA signature s component (hex string)
                      example: '0xfedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321'
                    v:
                      type: integer
                      description: ECDSA recovery id (27 or 28)
                      example: 27
                  required:
                  - r
                  - s
                  - v
                vaultAddress:
                  type: string
                  description: Address when trading on behalf of a vault or subaccount (optional)
                  nullable: true
                expiresAfter:
                  type: integer
                  description: Timestamp in milliseconds after which the request is rejected (optional)
              required:
              - action
              - nonce
              - signature
            example:
