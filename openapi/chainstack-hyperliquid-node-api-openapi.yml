                      type: integer
                      description: Order ID - unique identifier for the order
                    side:
                      type: string
                      description: 'Order side: ''A'' for ask (sell), ''B'' for bid (buy)'
                    sz:
                      type: string
                      description: Remaining size of the order (unfilled amount)
                    timestamp:
                      type: integer
                      description: Order creation timestamp in milliseconds
                  required:
                  - coin
                  - limitPx
                  - oid
                  - side
                  - sz
                  - timestamp
  /info_order_status:
    post:
      summary: Query order status by oid or cloid
      description: Retrieve the current status of an order using either the order ID (oid) or client order ID (cloid). This
        endpoint provides detailed information about order state, execution status, and timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - user
              - oid
              properties:
                type:
                  type: string
                  enum:
                  - orderStatus
                  default: orderStatus
                  description: The request type. Must be 'orderStatus' to query order status.
                user:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                  default: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
                  description: Address in 42-character hexadecimal format; e.g. 0x0000000000000000000000000000000000000000.
                oid:
                  oneOf:
                  - type: integer
                    format: int64
                    description: Order ID as a 64-bit unsigned integer
                  - type: string
                    pattern: ^[a-fA-F0-9]{32}$
                    description: Client order ID as a 16-byte hex string
                  default: 127244980388
                  description: Either u64 representing the order id or 16-byte hex string representing the client order id
            example:
              type: orderStatus
              user: '0x31ca8395cf837de08b24da3f660e77761dfb974b'
              oid: 127244980388
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - order
                      description: Indicates that order information is available
                    order:
                      type: object
                      properties:
                        order:
                          type: object
                          properties:
                            coin:
                              type: string
                              description: Asset identifier (simple names like 'BTC', 'ETH' for perpetuals; spot format like
                                '@107' for spot trades)
                            side:
                              type: string
                              enum:
                              - A
                              - B
                              description: 'Order side: ''A'' for Ask/Sell, ''B'' for Bid/Buy'
                            limitPx:
                              type: string
                              description: Limit price as a string for precision
                            sz:
                              type: string
                              description: Current order size (remaining quantity)
                            oid:
                              type: integer
                              format: int64
                              description: Order ID
                            timestamp:
                              type: integer
                              format: int64
                              description: Order creation timestamp in milliseconds
                            triggerCondition:
                              type: string
                              description: Trigger condition for conditional orders
                            isTrigger:
                              type: boolean
                              description: Whether this is a trigger order
                            triggerPx:
                              type: string
                              description: Trigger price for conditional orders
                            children:
                              type: array
                              items: {}
                              description: Child orders (for TP/SL orders)
                            isPositionTpsl:
                              type: boolean
                              description: Whether this is a position-level TP/SL order
                            reduceOnly:
                              type: boolean
                              description: Whether this is a reduce-only order
                            orderType:
                              type: string
                              description: Order type (e.g., 'Market', 'Limit')
                            origSz:
                              type: string
                              description: Original order size
                            tif:
                              type: string
                              description: Time in force (e.g., 'FrontendMarket', 'Gtc', 'Ioc')
                            cloid:
                              type: string
                              nullable: true
                              description: Client order ID if provided
                        status:
                          type: string
                          enum:
                          - open
                          - filled
                          - canceled
                          - triggered
                          - rejected
                          - marginCanceled
                          - vaultWithdrawalCanceled
                          - openInterestCapCanceled
                          - selfTradeCanceled
                          - reduceOnlyCanceled
                          - siblingFilledCanceled
                          - delistedCanceled
                          - liquidatedCanceled
                          - scheduledCancel
                          - tickRejected
                          - minTradeNtlRejected
                          - perpMarginRejected
                          - reduceOnlyRejected
                          - badAloPxRejected
                          - iocCancelRejected
                          - badTriggerPxRejected
                          - marketOrderNoLiquidityRejected
                          - positionIncreaseAtOpenInterestCapRejected
                          - positionFlipAtOpenInterestCapRejected
                          - tooAggressiveAtOpenInterestCapRejected
                          - openInterestIncreaseRejected
                          - insufficientSpotBalanceRejected
                          - oracleRejected
                          - perpMaxPositionRejected
                          description: Current order status
                        statusTimestamp:
                          type: integer
                          format: int64
                          description: Timestamp when the status was last updated
                - type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - unknownOid
                      description: Indicates that the order ID was not found
      tags:
      - General
      operationId: info_order_status
  /info_outcomemeta:
    post:
      tags:
      - General
      summary: info (outcomeMeta)
      operationId: infoOutcomeMeta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  default: outcomeMeta
                  enum:
                  - outcomeMeta
                  description: Request type to retrieve HIP-4 outcome market metadata
              required:
              - type
      responses:
        '200':
          description: Live HIP-4 outcome markets and categorical questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes:
                    type: array
                    description: Array of live outcome markets
                    items:
                      type: object
                      properties:
                        outcome:
                          type: integer
                          description: Outcome id; combine with side index to derive the asset encoding
                        name:
                          type: string
                          description: Human-readable market name
                        description:
                          type: string
                          description: For recurring binary markets, a pipe-separated key:value string (class, underlying,
                            expiry, targetPrice, period). For other market types, free-form text.
                        sideSpecs:
                          type: array
                          description: Two-element array describing the YES (index 0) and NO (index 1) sides
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Side name (for example, 'Yes' or 'No')
                  questions:
                    type: array
                    description: Array of categorical multi-outcome questions; mainnet returns an empty array at the time
                      of writing
                    items:
                      type: object
                      properties:
                        question:
                          type: integer
                          description: Question id
                        name:
                          type: string
                          description: Question text
                        description:
                          type: string
                          description: Free-form description
                        fallbackOutcome:
                          type: integer
                          description: Outcome id used if none of the named outcomes matches
                        namedOutcomes:
                          type: array
                          description: Outcome ids for the named legs
                          items:
                            type: integer
                        settledNamedOutcomes:
                          type: array
                          description: Outcome ids that have already settled
                          items:
                            type: integer
                example:
                  outcomes:
                  - outcome: 1
                    name: Recurring
                    description: class:priceBinary|underlying:BTC|expiry:20260504-0600|targetPrice:78213|period:1d
                    sideSpecs:
                    - name: 'Yes'
                    - name: 'No'
                  questions: []
