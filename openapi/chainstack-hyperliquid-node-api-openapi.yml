                s: '0xfedcba0987654321fedcba0987654321fedcba0987654321fedcba0987654321'
                v: 27
              vaultAddress: null
      responses:
        '200':
          description: Schedule cancel result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Request status
