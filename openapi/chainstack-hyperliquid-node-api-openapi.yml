    post:
      summary: eth_getLogs
      description: Returns event logs that match specified filter criteria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - method
              - params
              - id
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  default: '2.0'
                  description: JSON-RPC version
                method:
                  type: string
                  enum:
                  - eth_getLogs
                  default: eth_getLogs
                  description: The RPC method name
                params:
                  type: array
                  description: 'Parameters: [filterObject]'
                  default:
                  - address: '0x5555555555555555555555555555555555555555'
                    fromBlock: '0x9d0c37'
                    toBlock: '0x9d0c42'
                id:
                  type: integer
                  default: 1
                  description: Request identifier
            example:
              jsonrpc: '2.0'
              method: eth_getLogs
              params:
              - address: '0x5555555555555555555555555555555555555555'
                fromBlock: '0x9d0c37'
                toBlock: '0x9d0c42'
              id: 1
      responses:
        '200':
          description: Successful response with matching event logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: integer
                    description: Request identifier
                  result:
                    type: array
                    description: Array of log objects matching the filter criteria
                    items:
                      type: object
                      properties:
                        address:
                          type: string
                          description: Contract address that emitted the log
                        topics:
                          type: array
                          items:
                            type: string
                          description: Array of indexed event parameters
                        data:
                          type: string
                          description: Non-indexed event parameters as hexadecimal string
                        blockNumber:
                          type: string
                          description: Block number containing the log
                        blockHash:
                          type: string
                          description: Hash of the block containing the log
                        transactionHash:
                          type: string
                          description: Hash of the transaction that generated the log
                        transactionIndex:
                          type: string
                          description: Index of the transaction in the block
                        logIndex:
                          type: string
                          description: Index of the log in the transaction
                        removed:
                          type: boolean
                          description: Whether the log was removed due to chain reorganization
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                - address: '0x5555555555555555555555555555555555555555'
                  topics:
                  - '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
                  - '0x000000000000000000000000fc1286eeddf81d6955edad5c8d99b8aa32f3d2aa'
                  - '0x0000000000000000000000005555555555555555555555555555555555555555'
                  data: '0x0000000000000000000000000000000000000000000000000de0b6b3a7640000'
                  blockNumber: '0x9d0c37'
                  blockHash: '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'
                  transactionHash: '0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890'
                  transactionIndex: '0x0'
                  logIndex: '0x0'
                  removed: false
      tags:
      - General
      operationId: evm_eth_get_logs
  /evm_eth_get_proof:
    post:
      summary: eth_getProof
      description: Returns the Merkle proof for an account and optionally some storage keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - method
              - params
              - id
              properties:
                jsonrpc:
                  type: string
                  enum:
                  - '2.0'
                  default: '2.0'
                  description: JSON-RPC version
                method:
                  type: string
                  enum:
                  - eth_getProof
                  default: eth_getProof
                  description: The RPC method name
                params:
                  type: array
                  description: 'Parameters: [address, storageKeys, block]'
                  default:
                  - '0x69835D480110e4919B7899f465aAB101e21c8A87'
                  - []
                  - latest
                id:
                  type: integer
                  default: 1
                  description: Request identifier
            example:
              jsonrpc: '2.0'
              method: eth_getProof
              params:
              - '0x69835D480110e4919B7899f465aAB101e21c8A87'
              - []
              - latest
              id: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: '2.0'
                  id:
                    type: integer
                    example: 1
                  result:
                    type: object
                    description: The account and storage proofs
                    properties:
                      address:
                        type: string
                        description: The account address
                        example: '0x69835D480110e4919B7899f465aAB101e21c8A87'
                      accountProof:
                        type: array
                        description: Array of RLP-encoded Merkle tree nodes
                        items:
                          type: string
                      balance:
                        type: string
                        description: The account balance in wei
                        example: '0x0'
                      codeHash:
                        type: string
                        description: The hash of the account code
                        example: '0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470'
                      nonce:
                        type: string
                        description: The account nonce
                        example: '0x0'
                      storageHash:
                        type: string
                        description: The hash of the storage trie root
                        example: '0x56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421'
                      storageProof:
                        type: array
                        description: Array of storage proof objects
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: The storage key
                            value:
                              type: string
                              description: The storage value
                            proof:
                              type: array
                              description: Array of RLP-encoded nodes
                              items:
                                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    example: '2.0'
                  id:
                    type: integer
                    example: 1
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: -32602
                      message:
                        type: string
                        example: Invalid params
      tags:
      - General
      operationId: evm_eth_get_proof
