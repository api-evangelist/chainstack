openapi: 3.2.0
info:
  title: Chainstack TON Node Get Events API
  version: 1.0.0
  description: Chainstack-managed RPC node API for the TON blockchain. Endpoints follow the canonical JSON-RPC over HTTPS interface for the network. Authenticate against your Chainstack node's per-node URL (e.g. https://nd-XXX-XXX-XXX.p2pify.com/). Merged from the Chainstack Developer Portal per-method fragments at https://github.com/chainstack/dev-portal/tree/main/openapi/ton_node_api.
  contact:
    name: Chainstack API Support
    email: support@chainstack.com
  license:
    name: Chainstack Terms
    url: https://chainstack.com/terms-of-service/
servers:
- url: https://{node_id}.p2pify.com/{api_key}
  description: Chainstack-managed node endpoint
  variables:
    node_id:
      default: nd-000-000-000
      description: Your Chainstack node identifier
    api_key:
      default: <api-key>
      description: Per-node access key
tags:
- name: GetEvents
paths:
  /getEvents:
    get:
      summary: Get Events
      description: Query blockchain events with decoded actions
      operationId: getEvents
      tags:
      - GetEvents
      parameters:
      - name: account
        in: query
        description: Filter by account address
        schema:
          type: string
      - name: start_utime
        in: query
        description: Start of time range (unix timestamp)
        schema:
          type: integer
      - name: end_utime
        in: query
        description: End of time range (unix timestamp)
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of events to return
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        description: Number of events to skip
        schema:
          type: integer
          default: 0
      - name: sort
        in: query
        description: Sort order
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        trace_id:
                          type: string
                          description: Trace ID
                        external_hash:
                          type: string
                          description: External message hash
                        mc_seqno_start:
                          type: string
                          description: Start masterchain sequence number
                        mc_seqno_end:
                          type: string
                          description: End masterchain sequence number
                        start_lt:
                          type: string
                          description: Start logical time
                        start_utime:
                          type: integer
                          description: Start unix timestamp
                        end_lt:
                          type: string
                          description: End logical time
                        end_utime:
                          type: integer
                          description: End unix timestamp
                        trace_info:
                          type: object
                          description: Trace information
                        actions:
                          type: array
                          description: Decoded actions
                        is_incomplete:
                          type: boolean
                          description: Whether event is incomplete
                  address_book:
                    type: object
                    description: Address book mapping
components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    APIKeyQuery:
      type: apiKey
      in: query
      name: api_key
