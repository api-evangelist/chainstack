naftiko: 1.0.0-alpha2
info:
  label: Chainstack Platform API — Projects
  description: Chainstack Platform API — Projects business capability. Create, list, retrieve, update, and delete
    Chainstack Projects via the v1 Platform API.
  tags:
    - Chainstack
    - Platform
    - Projects
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
  - namespace: env
    keys:
      CHAINSTACK_API_KEY: CHAINSTACK_API_KEY
capability:
  consumes:
    - type: http
      namespace: platform-projects
      baseUri: https://api.chainstack.com
      description: Chainstack Platform API — Projects.
      resources:
        - name: v1-projects
          path: /v1/projects/
          operations:
            - name: listAllProjects
              method: GET
              description: List all Projects in your organization.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: createProject
              method: POST
              description: Create a new Project.
              outputRawFormat: json
              inputParameters:
                - name: body
                  in: body
                  type: object
                  description: Project creation payload.
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: v1-projects-id
          path: /v1/projects/{id}/
          operations:
            - name: retrieveProject
              method: GET
              description: Retrieve Project details by ID.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: updateProject
              method: PATCH
              description: Update Project name or properties.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                - name: body
                  in: body
                  type: object
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: deleteProject
              method: DELETE
              description: Delete a Project.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
      authentication:
        type: apikey
        key: Authorization
        value: 'Bearer {{env.CHAINSTACK_API_KEY}}'
        placement: header
  exposes:
    - type: rest
      namespace: platform-projects-rest
      port: 8080
      description: REST adapter for Chainstack Platform API — Projects.
      resources:
        - path: /v1/projects
          name: projects
          description: REST surface for project management.
          operations:
            - method: GET
              name: listProjects
              call: platform-projects.listAllProjects
            - method: POST
              name: createProject
              call: platform-projects.createProject
              with:
                body: rest.body
            - method: GET
              name: getProject
              call: platform-projects.retrieveProject
              with:
                id: rest.path.id
            - method: PATCH
              name: updateProject
              call: platform-projects.updateProject
              with:
                id: rest.path.id
                body: rest.body
            - method: DELETE
              name: deleteProject
              call: platform-projects.deleteProject
              with:
                id: rest.path.id
    - type: mcp
      namespace: platform-projects-mcp
      port: 9090
      transport: http
      description: MCP adapter for Chainstack Project management.
      tools:
        - name: chainstack-list-projects
          description: List Chainstack Projects.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: platform-projects.listAllProjects
        - name: chainstack-create-project
          description: Create a Chainstack Project.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: platform-projects.createProject
          with:
            body: tools.body
        - name: chainstack-get-project
          description: Retrieve a Chainstack Project by ID.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: platform-projects.retrieveProject
          with:
            id: tools.id
        - name: chainstack-update-project
          description: Update a Chainstack Project.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: platform-projects.updateProject
          with:
            id: tools.id
            body: tools.body
        - name: chainstack-delete-project
          description: Delete a Chainstack Project.
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: platform-projects.deleteProject
          with:
            id: tools.id
