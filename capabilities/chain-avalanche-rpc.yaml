naftiko: 1.0.0-alpha2
info:
  label: Chainstack Avalanche Node API
  description: Chainstack-managed Avalanche RPC capability. Consumes the canonical JSON-RPC (or chain-native) interface for
    Avalanche via a Chainstack Global, Dedicated, Unlimited, or Trader node. Provides MCP and REST adapters fronted by a single
    namespace per chain.
  tags:
  - Chainstack
  - Avalanche
  - Blockchain
  - RPC
  - AVAX
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    CHAINSTACK_NODE_URL: CHAINSTACK_NODE_URL
capability:
  consumes:
  - type: http
    namespace: chainstack-avalanche-rpc
    baseUri: '{{env.CHAINSTACK_NODE_URL}}'
    description: Chainstack-managed Avalanche RPC node endpoint.
    resources:
    - name: rpc
      path: /
      operations:
      - name: rpc_call
        method: POST
        description: Submit a JSON-RPC request to a Chainstack-managed Avalanche node. See the openapi spec for the full operation
          inventory.
        outputRawFormat: json
        inputParameters:
        - name: body
          in: body
          type: object
          description: 'JSON-RPC envelope: { jsonrpc: ''2.0'', id: <int>, method: <string>, params: <array> }'
          required: true
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: none
      description: Authentication is embedded in the node URL (per-node access key path).
  exposes:
  - type: mcp
    namespace: chainstack-avalanche-mcp
    port: 9090
    transport: http
    description: MCP adapter for the Chainstack Avalanche node RPC.
    tools:
    - name: chainstack-avalanche-rpc
      description: Submit a raw JSON-RPC request to a Chainstack-managed Avalanche node.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: chainstack-avalanche-rpc.rpc_call
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
