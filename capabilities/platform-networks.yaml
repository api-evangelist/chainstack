naftiko: 1.0.0-alpha2
info:
  label: Chainstack Platform API — Networks
  description: Chainstack Platform API — Networks business capability. Manage the Chainstack networks that group
    project nodes (consortium and public chain networks).
  tags:
    - Chainstack
    - Platform
    - Networks
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
  - namespace: env
    keys:
      CHAINSTACK_API_KEY: CHAINSTACK_API_KEY
capability:
  consumes:
    - type: http
      namespace: platform-networks
      baseUri: https://api.chainstack.com
      description: Chainstack Platform API — Networks.
      resources:
        - name: v1-networks
          path: /v1/networks/
          operations:
            - name: listAllNetworks
              method: GET
              description: List all networks in your organization.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: createNetwork
              method: POST
              description: Create a new network.
              outputRawFormat: json
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: v1-networks-id
          path: /v1/networks/{id}/
          operations:
            - name: retrieveNetwork
              method: GET
              description: Retrieve a network by ID.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: deleteNetwork
              method: DELETE
              description: Delete a network.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
      authentication:
        type: apikey
        key: Authorization
        value: 'Bearer {{env.CHAINSTACK_API_KEY}}'
        placement: header
