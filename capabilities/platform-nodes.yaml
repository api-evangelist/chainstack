naftiko: 1.0.0-alpha2
info:
  label: Chainstack Platform API — Nodes
  description: Chainstack Platform API — Nodes business capability. Provision, list, retrieve, update, and delete
    managed nodes across Chainstack-supported networks via the v1 Platform API.
  tags:
    - Chainstack
    - Platform
    - Nodes
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
  - namespace: env
    keys:
      CHAINSTACK_API_KEY: CHAINSTACK_API_KEY
capability:
  consumes:
    - type: http
      namespace: platform-nodes
      baseUri: https://api.chainstack.com
      description: Chainstack Platform API — Nodes.
      resources:
        - name: v1-nodes
          path: /v1/nodes/
          operations:
            - name: listAllNodes
              method: GET
              description: List all managed nodes across your organization.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: createNode
              method: POST
              description: Deploy a new managed node on a Chainstack network.
              outputRawFormat: json
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: v1-nodes-id
          path: /v1/nodes/{id}/
          operations:
            - name: retrieveNode
              method: GET
              description: Retrieve Node details by ID.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: updateNode
              method: PATCH
              description: Update Node properties.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                - name: body
                  in: body
                  type: object
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: deleteNode
              method: DELETE
              description: Decommission a managed node.
              outputRawFormat: json
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
              outputParameters:
                - name: result
                  type: object
                  value: $.
      authentication:
        type: apikey
        key: Authorization
        value: 'Bearer {{env.CHAINSTACK_API_KEY}}'
        placement: header
  exposes:
    - type: mcp
      namespace: platform-nodes-mcp
      port: 9090
      transport: http
      description: MCP adapter for Chainstack node management.
      tools:
        - name: chainstack-list-nodes
          description: List all Chainstack-managed nodes.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: platform-nodes.listAllNodes
        - name: chainstack-create-node
          description: Provision a new Chainstack-managed node.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: platform-nodes.createNode
          with:
            body: tools.body
        - name: chainstack-get-node
          description: Retrieve a Chainstack node by ID.
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: platform-nodes.retrieveNode
          with:
            id: tools.id
        - name: chainstack-update-node
          description: Update a Chainstack node.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: platform-nodes.updateNode
          with:
            id: tools.id
            body: tools.body
        - name: chainstack-delete-node
          description: Delete a Chainstack node.
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: platform-nodes.deleteNode
          with:
            id: tools.id
