description: Reconciled plans and Request Unit (RU) pricing for the Chainstack multi-chain RPC platform. Source-
  chainstack.com/pricing and docs.chainstack.com. 1 RU = 1 full-node API request; 2 RU = 1 archive-node request.
sources:
  - https://chainstack.com/pricing/
  - https://docs.chainstack.com/docs/pricing
  - https://chainstack.com/products/global-nodes/
  - https://chainstack.com/products/unlimited-nodes/
