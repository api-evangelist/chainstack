addons:
  - name: Unlimited Node
    description: Flat-fee tier-based RPS commitment with no per-request charges.
    entries:
      - label: 25 RPS
        price: '149.00'
        unit: month
      - label: 100 RPS
        price: '299.00'
        unit: month
      - label: 250 RPS
        price: '599.00'
        unit: month
      - label: 500 RPS
        price: '1199.00'
        unit: month
      - label: 1000 RPS
        price: '3199.00'
        unit: month
  - name: Yellowstone gRPC (Solana)
    description: Real-time Solana account/transaction/slot streaming via Yellowstone Geyser plugin.
    entries:
      - label: 1 stream
        price: '49.00'
        unit: month
      - label: Up to 10 streams
        price: '449.00'
        unit: month
  - name: Dedicated Node
    description: Isolated node infrastructure with extended namespaces (debug, txpool) and GraphQL.
    entries:
      - label: Starter
        price: '678.00'
        unit: month
        description: Starting price; varies by chain, machine size, and region.
      - label: Compute hour
        price: '0.50'
        unit: hour
        description: Pro-tier and above metered compute charge.
  - name: Warp Transactions
    description: Optimized propagation for paid transaction broadcast.
    entries:
      - label: Per transaction
        price: '0.15'
        unit: transaction
support:
  - name: Community
    price: '0.00'
    description: Public Discord, docs, and community forums.
  - name: Standard
    price: included
    description: 24x5 ticket support with under 24 hour response, included with Growth and above.
  - name: Professional
    price: '100.00'
    unit: month
    description: Faster response SLAs and priority queue.
  - name: Premium
    price: '1000.00'
    unit: month
    description: 24x7 priority support with dedicated CSM and incident bridge.
geo:
  - Asia-Pacific
  - Europe
  - United States
notes:
  - Annual billing delivers up to 16 percent savings versus month-to-month.
  - Archive data requests cost 2 RU each; full-node requests cost 1 RU each.
  - Request Units are computed at the platform layer; no per-method multipliers are applied.
  - Crypto payments accepted via NOWPayments (150+ supported coins).
