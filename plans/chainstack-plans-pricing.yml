      - label: Monthly fee
        name: fee
        type: recurring
        metric: subscription
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Included Request Units
        name: included_ru
        type: included
        metric: request_unit
        limit: 3000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Overage Request Units
        name: overage_ru
        type: metered
        metric: request_unit
        limit: -1
        timeFrame: month
        geo: global
        unit: 1000000
        price: '20.00'
        userMultiplied: false
