specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Chainstack
providerId: chainstack
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - FinOps
  - Cost Management
  - FOCUS
  - Blockchain
  - RPC
description: FOCUS-aligned FinOps definition for Chainstack's multi-chain RPC platform. Request Unit metering with
  tier-based discount lanes, dedicated-node compute-hour metering, and per-transaction Warp charges.
sources:
  - https://chainstack.com/pricing/
  - https://docs.chainstack.com/docs/about-billing
  - https://docs.chainstack.com/docs/pricing
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Chainstack
serviceCategory: Blockchain Infrastructure
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  primaryUnit: request_unit
  secondaryUnits:
    - compute_hour
    - transaction
    - stream_subscription
focusColumns:
  ServiceName: Chainstack RPC
  ServiceCategory: Blockchain Infrastructure
  ProviderName: Chainstack
  PublisherName: Chainstack
  InvoiceIssuerName: Chainstack
  PricingCategory: Usage-Based
  PricingUnit: MRU
  BillingCurrency: USD
meters:
  - name: full_node_request_units
    unit: request_unit
    aggregation: sum
    dimensions:
      - protocol
      - network
      - project
      - region
      - method
  - name: archive_node_request_units
    unit: request_unit
    aggregation: sum
    dimensions:
      - protocol
      - network
      - project
      - region
      - method
  - name: dedicated_node_compute_hours
    unit: hour
    aggregation: sum
    dimensions:
      - protocol
      - region
      - machine_size
  - name: yellowstone_grpc_streams
    unit: stream
    aggregation: max
    dimensions:
      - protocol
      - region
  - name: warp_transactions
    unit: transaction
    aggregation: sum
    dimensions:
      - protocol
      - network
  - name: faucet_requests
    unit: request
    aggregation: sum
    dimensions:
      - protocol
      - testnet
discounts:
  - id: annual-commit
    type: commitment
    description: Up to 16 percent savings versus month-to-month when billed annually.
  - id: payg-volume
    type: volume
    description: Pay-As-You-Go discount lane for accounts spending more than $1,000/month; typically 50 percent or
      more savings.
  - id: unlimited-node
    type: flat-fee
    description: Flat-fee monthly tiers eliminate per-request charges; useful for predictable high-volume
      workloads.
allocation:
  - dimension: project
    description: All requests are scoped to a Chainstack Project; use project ID as the canonical cost-allocation
      key.
  - dimension: network
    description: Use network ID (e.g. ethereum-mainnet, solana-mainnet) for chain-level allocation.
  - dimension: node
    description: Each managed node has a stable nd-XXX-XXX-XXX identifier suitable for fine-grained allocation.
tags:
  - Allow user-defined tags via the Chainstack Platform API on Projects and Nodes.
  - Use tag-based allocation in third-party FinOps tooling.
recommendations:
  - Move predictable workloads onto Unlimited Nodes or Pay-As-You-Go for cost predictability.
  - Cache idempotent reads (eth_chainId, eth_blockNumber) at the application edge.
  - Prefer archive nodes only when historical state is needed (2 RU per request).
  - Use Yellowstone gRPC streaming instead of high-frequency polling on Solana.
  - Enable IP allowlisting and HTTP Origin filtering to prevent rogue consumption.
