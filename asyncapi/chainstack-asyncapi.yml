      summary: Cancel a Solana accountSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

  solana/programSubscribe:
    description: Subscribe to changes on all accounts owned by a Solana program.
    publish:
      operationId: solanaProgramSubscribe
      summary: Subscribe to a Solana program
      tags:
        - name: Solana
        - name: Subscribe
      message:
        $ref: '#/components/messages/SolanaProgramSubscribeRequest'
    subscribe:
      operationId: solanaProgramNotification
      summary: Receive Solana program-owned account notifications
      tags:
        - name: Solana
        - name: Notification
      message:
        $ref: '#/components/messages/SolanaProgramNotification'

  solana/programUnsubscribe:
    description: Cancel an existing programSubscribe subscription.
    publish:
      operationId: solanaProgramUnsubscribe
      summary: Cancel a Solana programSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

  solana/logsSubscribe:
    description: Subscribe to transaction logs on Solana, optionally filtered by mentioned accounts.
    publish:
      operationId: solanaLogsSubscribe
      summary: Subscribe to Solana logs
      tags:
        - name: Solana
        - name: Subscribe
      message:
        $ref: '#/components/messages/SolanaLogsSubscribeRequest'
    subscribe:
      operationId: solanaLogsNotification
      summary: Receive Solana logs notifications
      tags:
        - name: Solana
        - name: Notification
      message:
        $ref: '#/components/messages/SolanaLogsNotification'

  solana/logsUnsubscribe:
    description: Cancel an existing logsSubscribe subscription.
    publish:
      operationId: solanaLogsUnsubscribe
      summary: Cancel a Solana logsSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

  solana/signatureSubscribe:
    description: Subscribe to status changes for a specific transaction signature.
    publish:
      operationId: solanaSignatureSubscribe
      summary: Subscribe to a Solana transaction signature
      tags:
        - name: Solana
        - name: Subscribe
      message:
        $ref: '#/components/messages/SolanaSignatureSubscribeRequest'
    subscribe:
      operationId: solanaSignatureNotification
      summary: Receive Solana signature notifications
      tags:
        - name: Solana
        - name: Notification
      message:
        $ref: '#/components/messages/SolanaSignatureNotification'

  solana/signatureUnsubscribe:
    description: Cancel an existing signatureSubscribe subscription.
    publish:
      operationId: solanaSignatureUnsubscribe
      summary: Cancel a Solana signatureSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

  solana/slotSubscribe:
    description: Subscribe to notifications about new Solana slots being processed by the validator.
    publish:
      operationId: solanaSlotSubscribe
      summary: Subscribe to Solana slots
      tags:
        - name: Solana
        - name: Subscribe
      message:
        $ref: '#/components/messages/SolanaSlotSubscribeRequest'
    subscribe:
      operationId: solanaSlotNotification
      summary: Receive Solana slot notifications
      tags:
        - name: Solana
        - name: Notification
      message:
        $ref: '#/components/messages/SolanaSlotNotification'

  solana/slotUnsubscribe:
    description: Cancel an existing slotSubscribe subscription.
    publish:
      operationId: solanaSlotUnsubscribe
      summary: Cancel a Solana slotSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

  solana/slotsUpdatesSubscribe:
    description: Subscribe to detailed slot update notifications (first shred received, completed, created bank, frozen, optimistically confirmed, root).
    publish:
      operationId: solanaSlotsUpdatesSubscribe
      summary: Subscribe to Solana slots updates
      tags:
        - name: Solana
        - name: Subscribe
      message:
        $ref: '#/components/messages/SolanaSlotsUpdatesSubscribeRequest'
    subscribe:
      operationId: solanaSlotsUpdatesNotification
      summary: Receive Solana slots updates notifications
      tags:
        - name: Solana
        - name: Notification
      message:
        $ref: '#/components/messages/SolanaSlotsUpdatesNotification'

  solana/slotsUpdatesUnsubscribe:
    description: Cancel an existing slotsUpdatesSubscribe subscription.
    publish:
      operationId: solanaSlotsUpdatesUnsubscribe
      summary: Cancel a Solana slotsUpdatesSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

  solana/blockSubscribe:
    description: |
      Subscribe to confirmed Solana blocks. Available on Chainstack Solana Mainnet
      and Devnet (per the Chainstack August 15, 2024 release).
    publish:
      operationId: solanaBlockSubscribe
      summary: Subscribe to Solana blocks
      tags:
        - name: Solana
