  solana/rootSubscribe:
    description: Subscribe to root slot notifications (rooted slot number + estimated production timestamp).
    publish:
      operationId: solanaRootSubscribe
      summary: Subscribe to Solana root slots
      tags:
        - name: Solana
        - name: Subscribe
      message:
        $ref: '#/components/messages/SolanaRootSubscribeRequest'
    subscribe:
      operationId: solanaRootNotification
      summary: Receive Solana root notifications
      tags:
        - name: Solana
        - name: Notification
      message:
        $ref: '#/components/messages/SolanaRootNotification'

  solana/rootUnsubscribe:
    description: Cancel an existing rootSubscribe subscription.
    publish:
      operationId: solanaRootUnsubscribe
      summary: Cancel a Solana rootSubscribe
      tags:
        - name: Solana
        - name: Unsubscribe
      message:
        $ref: '#/components/messages/SolanaUnsubscribeRequest'

components:

  messages:

    # =========================================================================
    # JSON-RPC subscription requests - EVM
    # =========================================================================

    EthSubscribeNewHeadsRequest:
      name: ethSubscribeNewHeads
      title: eth_subscribe ("newHeads") request
      summary: JSON-RPC 2.0 request to subscribe to new block headers.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscribeNewHeadsRequest'
      examples:
        - name: BasicRequest
          payload:
            id: 1
            jsonrpc: '2.0'
            method: eth_subscribe
            params:
              - newHeads

    EthSubscribeLogsRequest:
      name: ethSubscribeLogs
      title: eth_subscribe ("logs") request
      summary: JSON-RPC 2.0 request to subscribe to event logs matching an address/topics filter.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscribeLogsRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: eth_subscribe
            params:
              - logs
              - address: '0x4d224452801ACEd8B2F0aebE155379bb5D594381'
                topics:
                  - '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'

    EthSubscribeNewPendingTransactionsRequest:
      name: ethSubscribeNewPendingTransactions
      title: eth_subscribe ("newPendingTransactions") request
      summary: JSON-RPC 2.0 request to subscribe to new pending transactions.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscribeNewPendingTransactionsRequest'
      examples:
        - name: HashesOnly
          payload:
            id: 1
            jsonrpc: '2.0'
            method: eth_subscribe
            params:
              - newPendingTransactions
        - name: FullTransactionObjects
          payload:
            id: 1
            jsonrpc: '2.0'
            method: eth_subscribe
            params:
              - newPendingTransactions
              - true

    EthSubscribeSyncingRequest:
      name: ethSubscribeSyncing
      title: eth_subscribe ("syncing") request
      summary: JSON-RPC 2.0 request to subscribe to node sync status changes.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscribeSyncingRequest'
      examples:
        - name: BasicRequest
          payload:
            id: 1
            jsonrpc: '2.0'
            method: eth_subscribe
            params:
              - syncing

    EthUnsubscribeRequest:
      name: ethUnsubscribe
      title: eth_unsubscribe request
      summary: JSON-RPC 2.0 request to cancel an existing subscription.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthUnsubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            id: 1
            jsonrpc: '2.0'
            method: eth_unsubscribe
            params:
              - '0x9cef478923ff08bf67fde6c64013158d'

    BaseSubscribeNewFlashblocksRequest:
      name: baseSubscribeNewFlashblocks
      title: eth_subscribe ("newFlashblocks") request (Base)
      summary: Subscribe to Chainstack Base Flashblocks preconfirmation snapshots (~200 ms cadence).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BaseSubscribeNewFlashblocksRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: eth_subscribe
            params:
              - newFlashblocks

    BaseSubscribeNewFlashblockTransactionsRequest:
      name: baseSubscribeNewFlashblockTransactions
      title: eth_subscribe ("newFlashblockTransactions") request (Base)
      summary: Subscribe to transactions inside Base Flashblocks preconfirmations.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BaseSubscribeNewFlashblockTransactionsRequest'
      examples:
        - name: MinimalData
          payload:
            jsonrpc: '2.0'
            id: 1
            method: eth_subscribe
            params:
              - newFlashblockTransactions
        - name: FullTransactionObjects
          payload:
            jsonrpc: '2.0'
            id: 1
            method: eth_subscribe
            params:
              - newFlashblockTransactions
              - true

    BaseSubscribePendingLogsRequest:
      name: baseSubscribePendingLogs
      title: eth_subscribe ("pendingLogs") request (Base)
      summary: Subscribe to event logs from pre-confirmed Flashblock transactions on Base.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BaseSubscribePendingLogsRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: eth_subscribe
            params:
              - pendingLogs
              - address: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                topics:
                  - '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'

    MonadSubscribeMonadNewHeadsRequest:
      name: monadSubscribeMonadNewHeads
      title: eth_subscribe ("monadNewHeads") request (Monad)
      summary: Subscribe to Monad block headers across the consensus lifecycle.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MonadSubscribeMonadNewHeadsRequest'
      examples:
        - name: BasicRequest
          payload:
            id: 1
            jsonrpc: '2.0'
            method: eth_subscribe
            params:
              - monadNewHeads

    # =========================================================================
    # JSON-RPC subscription notifications - EVM
    # =========================================================================

    EthSubscriptionNewHeadsNotification:
      name: ethSubscriptionNewHeads
      title: eth_subscription notification (newHeads)
      summary: Push notification carrying a new block header.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscriptionNewHeadsNotification'

    EthSubscriptionLogNotification:
      name: ethSubscriptionLog
      title: eth_subscription notification (logs / pendingLogs)
      summary: Push notification carrying an event log.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscriptionLogNotification'

    EthSubscriptionPendingTxNotification:
      name: ethSubscriptionPendingTx
      title: eth_subscription notification (newPendingTransactions)
      summary: Push notification carrying a pending transaction hash or full transaction object.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscriptionPendingTxNotification'

    EthSubscriptionSyncingNotification:
      name: ethSubscriptionSyncing
      title: eth_subscription notification (syncing)
      summary: Push notification carrying a sync status object or `false`.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscriptionSyncingNotification'

    EthSubscriptionFlashblockNotification:
      name: ethSubscriptionFlashblock
      title: eth_subscription notification (newFlashblocks)
      summary: Push notification carrying a Base Flashblocks block-in-progress snapshot.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscriptionFlashblockNotification'

    EthSubscriptionFlashblockTxNotification:
      name: ethSubscriptionFlashblockTx
      title: eth_subscription notification (newFlashblockTransactions)
      summary: Push notification carrying a transaction included in a Base Flashblocks preconfirmation.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EthSubscriptionFlashblockTxNotification'

    MonadSubscriptionMonadNewHeadsNotification:
      name: monadSubscriptionMonadNewHeads
      title: eth_subscription notification (monadNewHeads)
      summary: Push notification carrying a Monad block header tagged with its commitState.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MonadSubscriptionMonadNewHeadsNotification'

    # =========================================================================
    # JSON-RPC subscription requests - Solana
    # =========================================================================

    SolanaAccountSubscribeRequest:
      name: solanaAccountSubscribe
      title: accountSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaAccountSubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: accountSubscribe
            params:
              - 39azUYFWPz3VHgKCf3VChUwbpURdCHRxjWVowf5jUJjg
              - encoding: jsonParsed
                commitment: finalized

    SolanaProgramSubscribeRequest:
      name: solanaProgramSubscribe
      title: programSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaProgramSubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: programSubscribe
            params:
              - 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P
              - encoding: jsonParsed
                commitment: finalized

    SolanaLogsSubscribeRequest:
      name: solanaLogsSubscribe
      title: logsSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaLogsSubscribeRequest'
      examples:
        - name: AllLogs
          payload:
            jsonrpc: '2.0'
            id: 1
            method: logsSubscribe
            params:
              - all
        - name: FilteredByMentions
          payload:
            jsonrpc: '2.0'
            id: 1
            method: logsSubscribe
            params:
              - mentions:
                  - 11111111111111111111111111111111
              - commitment: finalized

    SolanaSignatureSubscribeRequest:
      name: solanaSignatureSubscribe
      title: signatureSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaSignatureSubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: signatureSubscribe
            params:
              - 5h7iN3JmJzVtL4UTQHkxnhq8Pj3eNm9DvLwTQqgxwjNT9PqXJ8mCgUgFb1m4kK
              - commitment: finalized
                enableReceivedNotification: true

    SolanaSlotSubscribeRequest:
      name: solanaSlotSubscribe
      title: slotSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaSlotSubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: slotSubscribe

    SolanaSlotsUpdatesSubscribeRequest:
      name: solanaSlotsUpdatesSubscribe
      title: slotsUpdatesSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaSlotsUpdatesSubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: slotsUpdatesSubscribe

    SolanaBlockSubscribeRequest:
      name: solanaBlockSubscribe
      title: blockSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaBlockSubscribeRequest'
      examples:
        - name: ByProgramMention
          payload:
            jsonrpc: '2.0'
            id: '1'
            method: blockSubscribe
            params:
              - mentionsAccountOrProgram: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P
              - commitment: confirmed
                encoding: base64

    SolanaRootSubscribeRequest:
      name: solanaRootSubscribe
      title: rootSubscribe request (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaRootSubscribeRequest'
      examples:
        - name: BasicRequest
          payload:
            jsonrpc: '2.0'
            id: 1
            method: rootSubscribe

    SolanaUnsubscribeRequest:
      name: solanaUnsubscribe
      title: Solana unsubscribe request
      summary: Cancel an existing Solana subscription by ID. The method name varies (accountUnsubscribe, programUnsubscribe, logsUnsubscribe, signatureUnsubscribe, slotUnsubscribe, slotsUpdatesUnsubscribe, blockUnsubscribe, rootUnsubscribe).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaUnsubscribeRequest'
      examples:
        - name: AccountUnsubscribe
          payload:
            jsonrpc: '2.0'
            id: 1
            method: accountUnsubscribe
            params:
              - 0

    # =========================================================================
    # JSON-RPC subscription notifications - Solana
    # =========================================================================

    SolanaAccountNotification:
      name: solanaAccountNotification
      title: accountNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaAccountNotification'

    SolanaProgramNotification:
      name: solanaProgramNotification
      title: programNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaProgramNotification'

    SolanaLogsNotification:
      name: solanaLogsNotification
      title: logsNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaLogsNotification'

    SolanaSignatureNotification:
      name: solanaSignatureNotification
      title: signatureNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaSignatureNotification'

    SolanaSlotNotification:
      name: solanaSlotNotification
      title: slotNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaSlotNotification'

    SolanaSlotsUpdatesNotification:
      name: solanaSlotsUpdatesNotification
      title: slotsUpdatesNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaSlotsUpdatesNotification'

    SolanaBlockNotification:
      name: solanaBlockNotification
      title: blockNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaBlockNotification'

    SolanaRootNotification:
      name: solanaRootNotification
      title: rootNotification (Solana)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SolanaRootNotification'

  schemas:

    # =========================================================================
    # JSON-RPC envelopes
    # =========================================================================

    JsonRpcRequestEnvelope:
      type: object
      description: Common JSON-RPC 2.0 request envelope used by every Chainstack RPC subscription channel.
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
          default: '2.0'
        id:
          oneOf:
            - type: integer
            - type: string
          description: Client-chosen identifier echoed in the JSON-RPC response.
          default: 1
        method:
          type: string
          description: JSON-RPC method name (e.g. eth_subscribe, eth_unsubscribe, accountSubscribe).
        params:
          type: array
          description: Method parameters; structure depends on the method.

    JsonRpcSubscribeResponse:
      type: object
      description: JSON-RPC 2.0 response returned immediately after a subscribe call. The `result` is the subscription ID used to correlate subsequent push notifications and to issue an unsubscribe.
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          oneOf:
            - type: integer
            - type: string
        result:
          description: Subscription ID. EVM endpoints return a hex string; Solana endpoints return an integer.
          oneOf:
            - type: string
              pattern: '^0x[0-9a-fA-F]+$'
            - type: integer

    JsonRpcUnsubscribeResponse:
      type: object
      description: JSON-RPC 2.0 response returned after an unsubscribe call. `result` is `true` if the subscription was found and cancelled.
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        id:
          oneOf:
            - type: integer
            - type: string
        result:
          type: boolean

    # =========================================================================
    # EVM eth_subscribe request payloads
    # =========================================================================

    EthSubscribeNewHeadsRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                enum: ['newHeads']

    EthSubscribeLogsRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    enum: ['logs']
                  - type: object
                    description: Log filter for the subscription.
                    properties:
                      address:
                        oneOf:
                          - type: string
                            description: Single contract address.
                          - type: array
                            items:
                              type: string
                      topics:
                        type: array
                        description: |
                          Up to four 32-byte topics. Each element may be a string (exact match),
                          null (wildcard), or an array of strings (OR-match).
                        items:
                          oneOf:
                            - type: string
                            - type: 'null'
                            - type: array
                              items:
                                type: string

    EthSubscribeNewPendingTransactionsRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    enum: ['newPendingTransactions']
                  - type: boolean
                    description: When `true`, push the full transaction object instead of just the hash.

    EthSubscribeSyncingRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                enum: ['syncing']

    EthUnsubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_unsubscribe
              default: eth_unsubscribe
            params:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                description: Subscription ID to cancel (hex string).
                pattern: '^0x[0-9a-fA-F]+$'

    BaseSubscribeNewFlashblocksRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                enum: ['newFlashblocks']

    BaseSubscribeNewFlashblockTransactionsRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    enum: ['newFlashblockTransactions']
                  - type: boolean
                    description: When `true`, include complete transaction objects and associated logs in each notification.

    BaseSubscribePendingLogsRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    enum: ['pendingLogs']
                  - type: object
                    properties:
                      address:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      topics:
                        type: array
                        items:
                          oneOf:
                            - type: string
                            - type: 'null'
                            - type: array
                              items:
                                type: string

    MonadSubscribeMonadNewHeadsRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: eth_subscribe
              default: eth_subscribe
            params:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                enum: ['monadNewHeads']

    # =========================================================================
    # EVM eth_subscription notification payloads
    # =========================================================================

    EthSubscriptionNotificationEnvelope:
      type: object
      description: |
        Common envelope used for every eth_subscribe push notification. The server emits
        a JSON-RPC 2.0 "notification" (no `id`) with method `eth_subscription` and a
        `params` object containing the originating `subscription` ID and a `result` payload.
      required:
        - jsonrpc
        - method
        - params
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        method:
          type: string
          const: eth_subscription
        params:
          type: object
          required:
            - subscription
          properties:
            subscription:
              type: string
              description: Subscription ID that this notification belongs to.
              pattern: '^0x[0-9a-fA-F]+$'
            result:
              description: Payload specific to the subscription type.

    EthBlockHeader:
      type: object
      description: Ethereum block header pushed by newHeads.
      properties:
        number:
          type: string
          description: Block number, hex-encoded.
        hash:
          type: string
          description: Block hash.
        parentHash:
          type: string
        nonce:
          type: string
        sha3Uncles:
          type: string
        logsBloom:
          type: string
        transactionsRoot:
          type: string
        stateRoot:
          type: string
        receiptsRoot:
          type: string
        miner:
          type: string
        difficulty:
          type: string
        totalDifficulty:
          type: string
        extraData:
          type: string
        size:
          type: string
        gasLimit:
          type: string
        gasUsed:
          type: string
        timestamp:
          type: string
        baseFeePerGas:
          type: string
        mixHash:
          type: string
        withdrawalsRoot:
          type: string
        blobGasUsed:
          type: string
        excessBlobGas:
          type: string
        parentBeaconBlockRoot:
          type: string

    EthLog:
      type: object
      description: Ethereum event log pushed by logs.
      properties:
        removed:
          type: boolean
        logIndex:
          type: string
        transactionIndex:
          type: string
        transactionHash:
          type: string
        blockHash:
          type: string
        blockNumber:
          type: string
        address:
          type: string
        data:
          type: string
        topics:
          type: array
          items:
            type: string

    EthTransaction:
      type: object
      description: Ethereum transaction object (subset of fields).
      properties:
        hash:
          type: string
        nonce:
          type: string
        blockHash:
          type: string
          nullable: true
        blockNumber:
          type: string
          nullable: true
        transactionIndex:
          type: string
          nullable: true
        from:
          type: string
        to:
          type: string
          nullable: true
        value:
          type: string
        gas:
          type: string
        gasPrice:
          type: string
        maxFeePerGas:
          type: string
        maxPriorityFeePerGas:
          type: string
        input:
          type: string
        type:
          type: string
        chainId:
          type: string
        accessList:
          type: array
          items:
            type: object
        v:
          type: string
        r:
          type: string
        s:
          type: string

    EthSyncStatus:
      description: |
        While the node is syncing, the value is an object containing sync progress.
        Once fully synced, the value becomes `false`.
      oneOf:
        - type: boolean
          enum: [false]
        - type: object
          properties:
            syncing:
              type: boolean
            status:
              type: object
              properties:
                startingBlock:
                  type: string
                currentBlock:
                  type: string
                highestBlock:
                  type: string
                pulledStates:
                  type: string
                knownStates:
                  type: string

    EthSubscriptionNewHeadsNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  $ref: '#/components/schemas/EthBlockHeader'

    EthSubscriptionLogNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  $ref: '#/components/schemas/EthLog'

    EthSubscriptionPendingTxNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  description: A pending transaction hash (default) or full transaction object (when subscribed with `true`).
                  oneOf:
                    - type: string
                    - $ref: '#/components/schemas/EthTransaction'

    EthSubscriptionSyncingNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  $ref: '#/components/schemas/EthSyncStatus'

    EthSubscriptionFlashblockNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  type: object
                  description: |
                    Base Flashblocks block snapshot. While the block is still forming,
                    `hash` and `stateRoot` are returned as 0x0000...0000.
                  properties:
                    hash:
                      type: string
                    parentHash:
                      type: string
                    stateRoot:
                      type: string
                    number:
                      type: string
                    timestamp:
                      type: string
                    gasUsed:
                      type: string
                    gasLimit:
                      type: string
                    baseFeePerGas:
                      type: string
                    miner:
                      type: string
                    transactions:
                      type: array
                      items:
                        $ref: '#/components/schemas/EthTransaction'

    EthSubscriptionFlashblockTxNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  oneOf:
                    - type: string
                      description: Pre-confirmed transaction hash (default).
                    - type: object
                      description: Full pre-confirmed transaction object with associated logs (when subscribed with `true`).
                      properties:
                        transaction:
                          $ref: '#/components/schemas/EthTransaction'
                        logs:
                          type: array
                          items:
                            $ref: '#/components/schemas/EthLog'

    MonadSubscriptionMonadNewHeadsNotification:
      allOf:
        - $ref: '#/components/schemas/EthSubscriptionNotificationEnvelope'
        - type: object
          properties:
            params:
              type: object
              properties:
                result:
                  type: object
                  description: |
                    Monad block header tagged with the consensus lifecycle stage of the proposal.
                    The same block number may appear multiple times as `commitState` advances.
                  properties:
                    blockId:
                      type: string
                      description: Unique identifier for the specific block proposal.
                    commitState:
                      type: string
                      enum: [Proposed, Voted, Finalized, Verified]
                      description: Current lifecycle stage of the block.
                    number:
                      type: string
                    hash:
                      type: string
                    parentHash:
                      type: string
                    timestamp:
                      type: string
                    gasUsed:
                      type: string
                    gasLimit:
                      type: string
                    miner:
                      type: string

    # =========================================================================
    # Solana subscription request payloads
    # =========================================================================

    SolanaCommitment:
      type: string
      enum: [processed, confirmed, finalized]
      default: finalized
      description: Solana state-query commitment level.

    SolanaEncoding:
      type: string
      enum: [base58, base64, base64+zstd, jsonParsed]
      description: Encoding used for the account or transaction data payload.

    SolanaAccountSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: accountSubscribe
              default: accountSubscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    description: Base-58 account public key.
                  - type: object
                    properties:
                      encoding:
                        $ref: '#/components/schemas/SolanaEncoding'
                      commitment:
                        $ref: '#/components/schemas/SolanaCommitment'

    SolanaProgramSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: programSubscribe
              default: programSubscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    description: Base-58 program ID public key.
                  - type: object
                    properties:
                      encoding:
                        $ref: '#/components/schemas/SolanaEncoding'
                      commitment:
                        $ref: '#/components/schemas/SolanaCommitment'
                      filters:
                        type: array
                        description: memcmp or dataSize filters.
                        items:
                          type: object

    SolanaLogsSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: logsSubscribe
              default: logsSubscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    enum: ['all']
                  - type: object
                    properties:
                      mentions:
                        type: array
                        items:
                          type: string
                          description: Base-58 public key to filter on.
                  - type: object
                    properties:
                      commitment:
                        $ref: '#/components/schemas/SolanaCommitment'

    SolanaSignatureSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: signatureSubscribe
              default: signatureSubscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    description: Base-58 transaction signature.
                  - type: object
                    properties:
                      commitment:
                        $ref: '#/components/schemas/SolanaCommitment'
                      enableReceivedNotification:
                        type: boolean
                        default: false

    SolanaSlotSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
          properties:
            method:
              type: string
              const: slotSubscribe
              default: slotSubscribe

    SolanaSlotsUpdatesSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
          properties:
            method:
              type: string
              const: slotsUpdatesSubscribe
              default: slotsUpdatesSubscribe

    SolanaBlockSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              const: blockSubscribe
              default: blockSubscribe
            params:
              type: array
              minItems: 1
              maxItems: 2
              items:
                anyOf:
                  - type: string
                    enum: ['all']
                  - type: object
                    properties:
                      mentionsAccountOrProgram:
                        type: string
                        description: Base-58 account or program public key to filter on.
                      slot:
                        type: integer
                        description: Starting slot number for block notifications.
                  - type: object
                    properties:
                      commitment:
                        $ref: '#/components/schemas/SolanaCommitment'
                      encoding:
                        type: string
                        enum: [json, jsonParsed, base58, base64]
                      transactionDetails:
                        type: string
                        enum: [full, accounts, signatures, none]
                      showRewards:
                        type: boolean
                      maxSupportedTransactionVersion:
                        type: integer

    SolanaRootSubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
          properties:
            method:
              type: string
              const: rootSubscribe
              default: rootSubscribe

    SolanaUnsubscribeRequest:
      allOf:
        - $ref: '#/components/schemas/JsonRpcRequestEnvelope'
        - type: object
          required:
            - method
            - params
          properties:
            method:
              type: string
              enum:
                - accountUnsubscribe
                - programUnsubscribe
                - logsUnsubscribe
                - signatureUnsubscribe
                - slotUnsubscribe
                - slotsUpdatesUnsubscribe
                - blockUnsubscribe
                - rootUnsubscribe
            params:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: integer
                description: Subscription ID returned by the corresponding subscribe call.

    # =========================================================================
    # Solana notification payloads
    # =========================================================================

    SolanaNotificationEnvelope:
      type: object
      description: |
        Common envelope used by every Solana subscription push notification. The server
        emits a JSON-RPC 2.0 notification (no `id`) whose `method` matches the originating
        subscription (e.g. accountNotification, programNotification, slotNotification).
      required:
        - jsonrpc
        - method
        - params
      properties:
        jsonrpc:
          type: string
          enum: ['2.0']
        method:
          type: string
          description: Notification method name (e.g. accountNotification, programNotification, logsNotification, signatureNotification, slotNotification, slotsUpdatesNotification, blockNotification, rootNotification).
        params:
          type: object
          required:
            - subscription
          properties:
            subscription:
              type: integer
              description: Subscription ID that this notification belongs to.
            result:
              description: Notification payload (shape depends on the originating subscription).

    SolanaContext:
      type: object
      properties:
        slot:
          type: integer

    SolanaAccount:
      type: object
      properties:
        lamports:
          type: integer
        owner:
          type: string
        data:
          description: Account data, encoded per the subscription's encoding option.
          oneOf:
            - type: array
              items:
                type: string
            - type: object
            - type: string
        executable:
          type: boolean
        rentEpoch:
          type: integer

    SolanaAccountNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: accountNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    context:
                      $ref: '#/components/schemas/SolanaContext'
                    value:
                      $ref: '#/components/schemas/SolanaAccount'

    SolanaProgramNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: programNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    context:
                      $ref: '#/components/schemas/SolanaContext'
                    value:
                      type: object
                      properties:
                        pubkey:
                          type: string
                        account:
                          $ref: '#/components/schemas/SolanaAccount'

    SolanaLogsNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: logsNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    context:
                      $ref: '#/components/schemas/SolanaContext'
                    value:
                      type: object
                      properties:
                        signature:
                          type: string
                        err:
                          nullable: true
                          oneOf:
                            - type: object
                            - type: string
                        logs:
                          type: array
                          items:
                            type: string

    SolanaSignatureNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: signatureNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    context:
                      $ref: '#/components/schemas/SolanaContext'
                    value:
                      type: object
                      properties:
                        err:
                          nullable: true
                          oneOf:
                            - type: object
                            - type: string

    SolanaSlotNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: slotNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    parent:
                      type: integer
                    root:
                      type: integer
                    slot:
                      type: integer

    SolanaSlotsUpdatesNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: slotsUpdatesNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    parent:
                      type: integer
                    slot:
                      type: integer
                    timestamp:
                      type: integer
                    type:
                      type: string
                      enum:
                        - firstShredReceived
                        - completed
                        - createdBank
                        - frozen
                        - dead
                        - optimisticConfirmation
                        - root

    SolanaBlockNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: blockNotification
            params:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    context:
                      $ref: '#/components/schemas/SolanaContext'
                    value:
                      type: object
                      properties:
                        slot:
                          type: integer
                        err:
                          nullable: true
                          oneOf:
                            - type: object
                            - type: string
                        block:
                          type: object
                          properties:
                            blockhash:
                              type: string
                            previousBlockhash:
                              type: string
                            parentSlot:
                              type: integer
                            blockTime:
                              type: integer
                              nullable: true
                            blockHeight:
                              type: integer
                              nullable: true
                            transactions:
                              type: array
                              items:
                                type: object

    SolanaRootNotification:
      allOf:
        - $ref: '#/components/schemas/SolanaNotificationEnvelope'
        - type: object
          properties:
            method:
              type: string
              const: rootNotification
            params:
              type: object
              properties:
                result:
                  type: integer
                  description: Newly rooted slot number.

  securitySchemes:
    nodeAccessKey:
      type: httpApiKey
      description: |
        Chainstack node access keys are embedded directly in the WebSocket URL path
        (`wss://<host>/<auth_key>`). Authentication is therefore handled at the URL
        layer rather than via HTTP headers — there is no Bearer or basic-auth header
        for the WebSocket session itself.
      in: query
      name: auth_key
