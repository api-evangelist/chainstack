  # ---------------------------------------------------------------------------
  # Monad eth_subscribe (chain-specific monadNewHeads)
  # https://docs.chainstack.com/reference/monad-subscribe-monadnewheads
  # ---------------------------------------------------------------------------
  monad/eth_subscribe/monadNewHeads:
    description: |
      Subscribe to Monad block headers via the consensus lifecycle. Each notification
      includes a `blockId` and `commitState` (Proposed / Voted / Finalized / Verified).
      The same block number may appear multiple times as its `commitState` advances.
      Typically delivers roughly one second ahead of the standard `newHeads` event.
    publish:
      operationId: monadSubscribeMonadNewHeads
      summary: Subscribe to monadNewHeads on Monad
      tags:
        - name: Monad
        - name: EVM
        - name: Subscribe
      message:
        $ref: '#/components/messages/MonadSubscribeMonadNewHeadsRequest'
    subscribe:
      operationId: monadMonadNewHeadsNotification
      summary: Receive Monad monadNewHeads notifications
      tags:
        - name: Monad
        - name: Notification
      message:
        $ref: '#/components/messages/MonadSubscriptionMonadNewHeadsNotification'

  # ---------------------------------------------------------------------------
  # Solana WebSocket pub/sub
  # https://docs.chainstack.com/reference/accountsubscribe-solana
  # https://docs.chainstack.com/reference/programsubscribe-solana
  # https://docs.chainstack.com/reference/logssubscribe-solana
  # https://docs.chainstack.com/reference/signaturesubscribe-solana
  # https://docs.chainstack.com/reference/slotsubscribe-solana
  # https://docs.chainstack.com/reference/slotsupdatessubscribe-solana
  # https://docs.chainstack.com/reference/blocksubscribe-solana
  # https://docs.chainstack.com/reference/rootsubscribe-solana
  # https://docs.chainstack.com/reference/accountunsubscribe-solana
  # https://docs.chainstack.com/reference/programunsubscribe-solana
  # https://docs.chainstack.com/reference/logsunsubscribe-solana
  # https://docs.chainstack.com/reference/signatureunsubscribe-solana
  # https://docs.chainstack.com/reference/slotunsubscribe-solana
  # https://docs.chainstack.com/reference/slotsupdatesunsubscribe-solana
  # https://docs.chainstack.com/reference/blockunsubscribe-solana
  # https://docs.chainstack.com/reference/rootunsubscribe-solana
  # ---------------------------------------------------------------------------
  solana/accountSubscribe:
    description: Subscribe to changes on a single Solana account.
    publish:
      operationId: solanaAccountSubscribe
      summary: Subscribe to a Solana account
      tags:
        - name: Solana
        - name: Subscribe
