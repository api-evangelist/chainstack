description: |
  Chainstack is a managed multi-chain RPC and node infrastructure platform supporting 70+ blockchain protocols including
  Ethereum, Solana, Bitcoin, BNB Smart Chain, Polygon, Arbitrum, Optimism, Base, Avalanche, TON, TRON, Starknet, zkSync
  Era, Hyperliquid, Monad, and many more. The platform exposes a REST Platform API for organization, project, network,
  and node lifecycle management, JSON-RPC endpoints for every supported chain, a Faucet API for testnet funding, real-
  time Solana streaming via Yellowstone gRPC, low-latency Trader Nodes via bloXroute, archive data with debug and trace
  namespaces, MEV protection, Flashblocks preconfirmations, and a Chainstack MCP server for AI agents.
apis:
  - aid: chainstack:chainstack-platform-api
    name: Chainstack Platform API
    tags:
      - Platform
      - Organization
      - Projects
      - Networks
      - Nodes
      - Management
    humanURL: https://docs.chainstack.com/reference/platform-api-getting-started
    properties:
      - url: https://docs.chainstack.com/reference/platform-api-getting-started
        type: Documentation
      - url: openapi/chainstack-platform-api-openapi.yml
        type: OpenAPI
      - url: json-schema/chainstack-node-schema.json
        type: JSONSchema
      - url: json-ld/chainstack-context.jsonld
        type: JSONLD
    description: >-
      REST API at api.chainstack.com for managing your organization, projects, networks, and managed nodes. Bearer-token
      authenticated via per-user API keys. v2 endpoints recommended; v1 endpoints cover organizations, projects,
      networks, nodes, marketplace, and legacy Goerli/Sepolia faucets.
  - aid: chainstack:chainstack-faucet-api
    name: Chainstack Faucet API
    tags:
