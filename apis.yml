    properties:
      - url: https://faucet.chainstack.com/
        type: Faucet
      - url: openapi/chainstack-faucet-api-openapi.yml
        type: OpenAPI
    description: >-
      Public Chainstack-operated testnet faucet for Hoodi, Sepolia, BNB Testnet, zkSync Testnet, Scroll Sepolia, and
      Polygon Amoy. JWT-authenticated POST /v1/faucet/{chain} request endpoint plus a transaction-history endpoint. Also
      available as a Telegram Mini App and via the Chainstack MCP server.
